<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Teacher Dashboard — Critical Thinking Auditor</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="components.css">
<script src="theme.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }

body {
  font-family: var(--tau-font-ui);
  background: var(--tau-bg);
  color: var(--tau-ink);
  font-size: 14px;
  line-height: 1.5;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* ── Header ── */
header {
  background: var(--tau-surface);
  border-bottom: 1px solid var(--tau-line);
  padding: 13px var(--tau-s6);
  display: flex;
  align-items: center;
  gap: var(--tau-s3);
  flex-shrink: 0;
}
header h1 { font-size: var(--tau-text-lg); font-weight: 700; letter-spacing: -0.2px; }
header .subtitle { font-size: var(--tau-text-xs); color: var(--tau-ink-soft); }
.back-link {
  margin-left: auto;
  font-size: var(--tau-text-xs);
  font-weight: 600;
  color: var(--tau-forest);
  background: var(--tau-surface-2);
  border: 1px solid var(--tau-line);
  padding: 5px var(--tau-s3);
  border-radius: var(--tau-r-pill);
  text-decoration: none;
  white-space: nowrap;
}
.back-link:hover { background: var(--tau-hover-surface); border-color: var(--tau-line-strong); }

/* ── Global tab nav ── */
.tab-nav {
  background: var(--tau-surface);
  border-bottom: 1px solid var(--tau-line);
  padding: 0 var(--tau-s6);
  display: flex;
  flex-shrink: 0;
}
.tab-btn {
  background: none;
  border: none;
  border-bottom: 2px solid transparent;
  padding: 10px var(--tau-s4);
  font-size: var(--tau-text-sm);
  font-weight: 500;
  color: var(--tau-ink-soft);
  cursor: pointer;
  transition: color 0.15s, border-color 0.15s;
}
.tab-btn:hover { color: var(--tau-ink); }
.tab-btn.active { color: var(--tau-forest); border-bottom-color: var(--tau-forest); }

/* ── Layout ── */
.layout {
  display: flex;
  flex: 1;
  overflow: hidden;
}

/* ── Sidebar ── */
.sidebar {
  width: 220px;
  flex-shrink: 0;
  background: var(--tau-surface);
  border-right: 1px solid var(--tau-line);
  overflow-y: auto;
  display: flex;
  flex-direction: column;
}
.sidebar-section {
  font-size: 10px;
  font-weight: 700;
  color: var(--tau-ink-faint);
  text-transform: uppercase;
  letter-spacing: 0.8px;
  padding: var(--tau-s3) var(--tau-s4) 5px;
  flex-shrink: 0;
}
.sidebar-item {
  display: flex;
  align-items: center;
  gap: var(--tau-s2);
  padding: 9px var(--tau-s4);
  cursor: pointer;
  border-left: 2px solid transparent;
  transition: background 0.1s;
  flex-shrink: 0;
}
.sidebar-item:hover { background: var(--tau-hover-surface); }
.sidebar-item.active { background: var(--tau-surface-2); border-left-color: var(--tau-forest); }
.sidebar-item-name {
  font-size: var(--tau-text-sm);
  font-weight: 500;
  color: var(--tau-ink);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.sidebar-item.active .sidebar-item-name { color: var(--tau-forest); font-weight: 600; }
.sidebar-item-sub {
  font-size: var(--tau-text-xs);
  color: var(--tau-ink-soft);
  margin-top: 1px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.sidebar-search {
  padding: var(--tau-s3) var(--tau-s3) 6px;
  flex-shrink: 0;
}
.sidebar-search input {
  width: 100%;
  padding: 6px var(--tau-s2);
  border: 1px solid var(--tau-line);
  border-radius: 4px;
  font-size: var(--tau-text-xs);
  background: var(--tau-bg);
  color: var(--tau-ink);
  outline: none;
  font-family: inherit;
}
.sidebar-search input:focus { border-color: var(--tau-forest); }

/* ── Content ── */
.content {
  flex: 1;
  overflow-y: auto;
  padding: var(--tau-s7) var(--tau-s7);
  background: var(--tau-bg);
}
.content-header {
  margin-bottom: var(--tau-s5);
  padding-bottom: var(--tau-s4);
  border-bottom: 1px solid var(--tau-line);
}
.content-title {
  font-size: var(--tau-text-xl);
  font-weight: 700;
  letter-spacing: -0.3px;
  color: var(--tau-ink);
}
.content-meta {
  font-size: var(--tau-text-xs);
  color: var(--tau-ink-soft);
  margin-top: 4px;
}

/* .chip and its variants (neutral/grey/positive/caution/attention) now come
   from components.css — this page's submission-status names (final/draft/
   not-started/missing) were an exact bg/fg duplicate of chip-positive/
   -caution/-grey/-attention, so the JS below now sets those directly. */

/* ── Roster table ──
   The teacher-facing equivalent of the report's .dim-grid: one row per student
   or assignment, a plain-language band for "how they're using AI" (never a
   raw score first), and a quiet "Worth a chat" column instead of a flag. */
.tbl-wrap { overflow-x: auto; border: 1px solid var(--tau-line); border-radius: var(--tau-r-md); background: var(--tau-surface); }
table.roster { width: 100%; border-collapse: collapse; font-size: var(--tau-text-sm); }
table.roster th, table.roster td {
  text-align: left; padding: 10px var(--tau-s4);
  border-bottom: 1px solid var(--tau-line);
}
table.roster th {
  font-size: var(--tau-text-xs);
  letter-spacing: 0.06em; text-transform: uppercase;
  color: var(--tau-ink-faint); font-weight: 600;
  background: var(--tau-surface-2);
  white-space: nowrap;
}
table.roster th.sortable { cursor: pointer; user-select: none; }
table.roster th.sortable:hover { color: var(--tau-ink); }
table.roster th.sortable .sort-arrow { font-size: 10px; margin-left: 3px; opacity: 0.35; font-style: normal; }
table.roster th.sort-active { color: var(--tau-forest); }
table.roster th.sort-active .sort-arrow { opacity: 1; color: var(--tau-forest); }
table.roster tbody tr:last-child td { border-bottom: none; }
table.roster tbody tr.row-clickable { cursor: pointer; transition: background 0.1s; }
table.roster tbody tr.row-clickable:hover { background: var(--tau-hover-surface); }
table.roster tbody tr.expanded-row { background: var(--tau-surface-2); }
table.roster tbody tr.drill-row { cursor: default; }
table.roster tbody tr.drill-row:hover { background: transparent; }
table.roster td.n { font-variant-numeric: tabular-nums; }
table.roster .who { display: flex; align-items: center; gap: 9px; }
table.roster .group-row { pointer-events: none; }
table.roster .group-row td { padding: var(--tau-s3) var(--tau-s4) 4px; background: var(--tau-bg); border-bottom: none; }
table.roster .group-label {
  font-size: var(--tau-text-xs); font-weight: 700; color: var(--tau-ink-faint);
  text-transform: uppercase; letter-spacing: 0.08em;
}

/* Quiet caution dot, never an alarm glyph — "worth a chat" is a
   conversation-starter, not a verdict, so it never renders in the same
   attention hue as a missed deadline. */
.flagdot {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: var(--tau-text-sm); color: var(--tau-ink-soft);
}
.no-signal { color: var(--tau-ink-faint); font-size: var(--tau-text-sm); }

.talkabout {
  display: flex; gap: var(--tau-s3); align-items: flex-start;
  margin: 0; padding: var(--tau-s4) var(--tau-s4);
  background: var(--tau-surface-2);
  border-top: 1px solid var(--tau-line);
}
.talkabout .mark {
  width: 24px; height: 24px; border-radius: 50%;
  background: var(--tau-surface); border: 1px solid var(--tau-line-strong);
  display: grid; place-items: center; flex: none;
  font-size: var(--tau-text-sm); color: var(--tau-ink-soft);
}
.talkabout .txt { font-size: var(--tau-text-sm); color: var(--tau-ink-soft); }
.talkabout .txt b { color: var(--tau-ink); font-weight: 600; }

/* ── Drill panel ── */
.drill-panel {
  background: var(--tau-surface-2);
  border-top: 1px solid var(--tau-line);
  padding: var(--tau-s4) var(--tau-s5);
}
.drill-panel-header {
  font-size: var(--tau-text-xs);
  font-weight: 600;
  color: var(--tau-ink-soft);
  text-transform: uppercase; letter-spacing: 0.5px;
  margin-bottom: var(--tau-s3);
}
.assignment-summary-row {
  display: flex; align-items: center; gap: var(--tau-s3);
  padding: 10px var(--tau-s4);
  background: var(--tau-surface);
  border: 1px solid var(--tau-line);
  border-radius: var(--tau-r-sm);
  cursor: pointer;
  user-select: none;
  font-size: var(--tau-text-sm);
}
.assignment-summary-row:hover { background: var(--tau-hover-surface); border-color: var(--tau-line-strong); }
.assignment-summary-row.expanded { background: var(--tau-surface-2); border-color: var(--tau-line-strong); border-bottom-left-radius: 0; border-bottom-right-radius: 0; }
.assignment-summary-row .chevron { font-size: 11px; color: var(--tau-ink-soft); width: 14px; flex-shrink: 0; }
.assignment-drill { border: 1px solid var(--tau-line-strong); border-top: none; border-bottom-left-radius: var(--tau-r-sm); border-bottom-right-radius: var(--tau-r-sm); }
.sub-history { display: flex; flex-direction: column; gap: 4px; }
.sub-row {
  display: flex; flex-direction: column;
  background: var(--tau-surface);
  border: 1px solid var(--tau-line);
  border-radius: var(--tau-r-sm);
  padding: 10px var(--tau-s4);
  font-size: var(--tau-text-xs);
}
.sub-row.flagged { border-color: var(--tau-caution); background: var(--tau-caution-bg); }
.sub-row-main { display: flex; align-items: center; gap: var(--tau-s3); }
.sub-num  { font-size: var(--tau-text-xs); font-weight: 600; color: var(--tau-ink-soft); width: 20px; flex-shrink: 0; }
.sub-date { color: var(--tau-ink-soft); width: 140px; flex-shrink: 0; font-size: var(--tau-text-xs); }
.sub-chip { width: 44px; text-align: center; flex-shrink: 0; }
.sub-total { font-size: var(--tau-text-md); font-weight: 700; width: 40px; text-align: right; flex-shrink: 0; }
.integrity-flags-row {
  display: flex; align-items: baseline; gap: 6px; flex-wrap: wrap;
  margin-top: 7px; padding-top: 7px;
  border-top: 1px solid var(--tau-line);
}
.flag-line {
  display: flex; align-items: baseline; gap: var(--tau-s2);
  font-size: var(--tau-text-xs);
  color: var(--tau-ink-soft);
}
.flag-learn-more {
  font-size: 10px; font-weight: 600;
  color: var(--tau-forest);
  text-decoration: none;
  white-space: nowrap;
  cursor: pointer;
  flex-shrink: 0;
}
.flag-learn-more:hover { text-decoration: underline; }

/* ── Dim scores ── */
.dim-scores { display: flex; gap: 5px; }
.dim-score {
  font-size: var(--tau-text-xs); color: var(--tau-ink-soft);
  background: var(--tau-surface-2);
  padding: 2px 5px; border-radius: 3px;
}
.dim-score span { font-weight: 700; color: var(--tau-ink); }

.tau-total { font-size: var(--tau-text-lg); font-weight: 700; }
.tau-denom { font-size: var(--tau-text-sm); color: var(--tau-ink-soft); font-weight: 400; }

.overview-card {
  background: var(--tau-surface);
  border: 1px solid var(--tau-line);
  border-radius: var(--tau-r-sm);
  padding: var(--tau-s3) var(--tau-s4);
  cursor: pointer;
  transition: background 0.1s, border-color 0.1s;
}
.overview-card:hover { background: var(--tau-hover-surface); border-color: var(--tau-line-strong); }

/* Side tray: .tray-overlay, .tray, .tray-header/-title/-subtitle/-close,
   .tray-body, .tray-section-label/-body, .tray-steps/-step-num all come from
   components.css now — this page only supplied the reference implementation
   that section was built from. */
/* Shape/colour come from components.css's .dot/.dot-caution now — this only
   carries the layout tweak (top alignment against the tray title). */
.tray-flag-icon { margin-top: 6px; flex-shrink: 0; }

/* ── Class drill student rows ── */
.class-student-row {
  display: flex;
  align-items: center;
  gap: var(--tau-s3);
  padding: 9px var(--tau-s3);
  border-radius: var(--tau-r-sm);
  cursor: pointer;
  transition: background 0.1s;
}
.class-student-row:hover { background: var(--tau-hover-surface); }
.class-student-row.missing { background: var(--tau-attention-bg); }
.class-student-row.missing:hover { background: color-mix(in oklab, var(--tau-attention-bg) 70%, var(--tau-ink-faint) 10%); }

/* ── Signal indicators ──
   "Worth a chat" is a quiet caution dot with words, never an alert glyph —
   the flag that shows the same signal in a table cell (.flagdot). */
.signal-pill-review {
  display: inline-flex; align-items: center; gap: 5px;
  font-size: var(--tau-text-xs);
  color: var(--tau-caution);
  white-space: nowrap;
  flex-shrink: 0;
  line-height: 1;
}
/* Same recipe as components.css's .dot-sm + .dot-caution — a ::before can't
   carry a second class, so the values are repeated rather than shared. */
.signal-pill-review::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: var(--tau-caution); flex: none; }
.signal-reason {
  font-size: var(--tau-text-xs);
  color: var(--tau-ink-soft);
  margin-top: 2px;
  line-height: 1.3;
  white-space: normal;
}

/* ── Filter chips ── */
.filter-chips {
  display: flex;
  gap: 5px;
  padding: 6px var(--tau-s3) 2px;
  flex-shrink: 0;
  flex-wrap: wrap;
}
.filter-chip {
  font-size: var(--tau-text-xs);
  font-weight: 600;
  padding: 3px var(--tau-s3);
  border-radius: var(--tau-r-pill);
  border: 1px solid var(--tau-line);
  background: var(--tau-surface);
  color: var(--tau-ink-soft);
  cursor: pointer;
  transition: all 0.1s;
  font-family: inherit;
}
.filter-chip:hover { color: var(--tau-ink); border-color: var(--tau-line-strong); }
.filter-chip.active-all    { background: var(--tau-surface-2); border-color: var(--tau-line-strong); color: var(--tau-forest); }
.filter-chip.active-review { background: var(--tau-caution-bg); border-color: var(--tau-caution); color: var(--tau-caution); }

/* ── Bar legend ── */
.bar-legend {
  display: flex;
  align-items: center;
  gap: var(--tau-s4);
  margin-top: var(--tau-s3);
  font-size: var(--tau-text-xs);
  color: var(--tau-ink-soft);
  flex-wrap: wrap;
}
.legend-swatch {
  display: inline-block;
  width: 10px; height: 10px;
  border-radius: 2px;
  margin-right: 3px;
  vertical-align: middle;
}

/* ── Flag detection modal ──
   Overlay/box chrome (fixed scrim, surface/border/radius/shadow) now comes
   from components.css's .scrim/.confirm. These rules keep only the fade
   transition .scrim doesn't have, and reset .confirm's flat-content padding
   and gap for a modal with its own bordered header/body regions. */
.modal-overlay {
  z-index: 200;
  opacity: 0; pointer-events: none;
  transition: opacity 0.18s ease;
}
.modal-overlay.open { opacity: 1; pointer-events: all; }
.modal {
  width: min(680px, 92vw);
  max-height: 82vh;
  padding: 0;
  gap: 0;
  overflow: hidden;
}
.modal-header {
  display: flex; align-items: flex-start; gap: var(--tau-s3);
  padding: var(--tau-s5) var(--tau-s6) var(--tau-s4);
  border-bottom: 1px solid var(--tau-line);
  flex-shrink: 0;
}
.modal-title { font-size: var(--tau-text-lg); font-weight: 700; letter-spacing: -0.2px; flex: 1; }
.modal-intro { font-size: var(--tau-text-xs); color: var(--tau-ink-soft); margin-top: 3px; line-height: 1.5; }
.modal-close {
  background: none; border: none; font-size: 18px;
  color: var(--tau-ink-soft); cursor: pointer;
  padding: 2px 6px; border-radius: 4px; line-height: 1; flex-shrink: 0;
}
.modal-close:hover { background: var(--tau-hover-surface); color: var(--tau-ink); }
.modal-body {
  flex: 1; overflow-y: auto;
  padding: var(--tau-s5) var(--tau-s6);
  display: flex; flex-direction: column; gap: 0;
}
.flag-card {
  padding: var(--tau-s4) 0;
  border-bottom: 1px solid var(--tau-line);
}
.flag-card:last-child { border-bottom: none; }
.flag-card-header { display: flex; align-items: center; gap: var(--tau-s3); margin-bottom: var(--tau-s2); }
.flag-card-title { font-size: var(--tau-text-sm); font-weight: 700; }
.flag-card-desc { font-size: var(--tau-text-xs); color: var(--tau-ink-soft); }
.flag-card-section { font-size: 10px; font-weight: 700; color: var(--tau-ink-soft); text-transform: uppercase; letter-spacing: 0.7px; margin: var(--tau-s3) 0 4px; }
.flag-card-body { font-size: var(--tau-text-xs); color: var(--tau-ink-soft); line-height: 1.55; }
.flag-card-steps { margin: 0; padding-left: var(--tau-s5); display: flex; flex-direction: column; gap: 3px; }
.flag-card-steps li { font-size: var(--tau-text-xs); color: var(--tau-ink-soft); line-height: 1.5; }
/* Colour comes from components.css's .chip-caution/.chip-neutral now — this
   modifier only carries the size/weight/uppercase this badge needs. */
.flag-type-label {
  font-size: 10px; font-weight: 700;
  text-transform: uppercase; letter-spacing: 0.7px;
  padding: 2px 7px; border-radius: var(--tau-r-pill);
  flex-shrink: 0;
}

/* ── Reflection arc ── */
.reflection-arc {
  background: var(--tau-surface);
  border: 1px solid var(--tau-line);
  border-radius: var(--tau-r-sm);
  padding: 10px var(--tau-s4);
  margin-bottom: var(--tau-s3);
}
.arc-label {
  font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.6px;
  color: var(--tau-ink-soft); margin-bottom: var(--tau-s2);
}
.arc-entries {
  display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
}
.arc-entry {
  display: flex; align-items: center; gap: 5px;
  background: var(--tau-surface-2); border: 1px solid var(--tau-line);
  border-radius: var(--tau-r-sm); padding: 4px var(--tau-s2);
  cursor: pointer; transition: background 0.1s, border-color 0.1s;
  font-size: var(--tau-text-xs);
}
.arc-entry:hover { background: var(--tau-hover-surface); border-color: var(--tau-line-strong); }
/* Colour comes from components.css's .chip-neutral/.chip-caution now. */
.arc-badge {
  font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.4px;
  padding: 1px 5px; border-radius: 3px; flex-shrink: 0;
}
.arc-excerpt { color: var(--tau-ink-soft); max-width: 140px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.arc-score { font-size: 10px; font-weight: 700; color: var(--tau-ink-soft); flex-shrink: 0; }
.arc-arrow { font-size: var(--tau-text-xs); color: var(--tau-ink-soft); }

/* ── Per-submission reflection ── */
.reflection-details {
  margin-top: 7px; padding-top: 7px;
  border-top: 1px solid var(--tau-line);
}
.reflection-summary {
  display: flex; align-items: center; gap: 7px;
  cursor: pointer; list-style: none; user-select: none;
  font-size: var(--tau-text-xs);
}
.reflection-summary::-webkit-details-marker { display: none; }
.reflection-summary::before { content: '▸'; font-size: 9px; color: var(--tau-ink-soft); flex-shrink: 0; }
details[open] .reflection-summary::before { content: '▾'; }
/* Colour comes from components.css's .chip-neutral/.chip-caution now. */
.reflect-type-badge {
  font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.4px;
  padding: 1px 6px; border-radius: 3px; flex-shrink: 0;
}
/* Colour comes from .chip-positive/.chip-attention/.chip-grey now. */
.score-delta {
  font-size: 10px; font-weight: 700; padding: 1px 5px; border-radius: 3px; flex-shrink: 0;
}
.reflect-excerpt { color: var(--tau-ink-soft); font-style: italic; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.reflect-full {
  margin-top: var(--tau-s2); padding: var(--tau-s2) 10px;
  background: var(--tau-surface-2); border-radius: var(--tau-r-sm);
  display: flex; flex-direction: column; gap: 6px;
}
.reflect-section { font-size: var(--tau-text-xs); color: var(--tau-ink-soft); line-height: 1.5; }
.reflect-label {
  font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px;
  color: var(--tau-ink-soft); margin-right: 5px;
}
</style>
</head>
<body>

<header>
  <h1>Critical Thinking Auditor</h1>
  <span class="subtitle">Teacher Dashboard</span>
  <button onclick="openFlagModal()" class="btn btn-quiet btn-sm" style="margin-left:auto">Worth a chat, explained</button>
  <a href="teacher.html" class="back-link" style="margin-left:0">+ New assignment</a>
  <a href="/" class="back-link" style="margin-left:0">← Student app</a>
  <span class="back-link" id="whoami" style="margin-left:0;border:none;cursor:default"></span>
  <a href="#" class="back-link" style="margin-left:0" onclick="event.preventDefault();logout()">Sign out</a>
  <button class="theme-toggle theme-toggle-end" type="button" aria-pressed="false" aria-label="Switch to dark theme"><span class="theme-toggle-icon" aria-hidden="true">&#9790;</span></button>
</header>

<nav class="tab-nav">
  <button class="tab-btn active" data-tab="overview">Overview</button>
  <button class="tab-btn"        data-tab="class">Class</button>
  <button class="tab-btn" data-tab="assignment">Assignment</button>

</nav>

<div class="scrim modal-overlay" id="flag-modal-overlay" onclick="closeFlagModal(event)">
  <div class="confirm modal" onclick="event.stopPropagation()">
    <div class="modal-header">
      <div style="flex:1;min-width:0">
        <div class="modal-title">Worth a chat, explained</div>
        <div class="modal-intro">The tool automatically checks every submission for these signals. They're never shown to students — they surface only here, as conversation-starters, never verdicts.</div>
      </div>

<script src="api.js"></script>
<script>
// ── Data ──────────────────────────────────────────────────────────────────────
// ── Data — loaded from the CTA app API (replaces the mock generator) ─────────
// Ported from teacher-dashboard.html; the four globals keep the exact shape
// the mock generator produced so all render code below is unchanged.

let ASSIGNMENTS = [], STUDENTS = [], CLASSES = [], SUBMISSIONS = {};

async function loadDashboardData() {
  const res = await fetch('/api/teacher/dashboard');
  if (res.status === 401) return requireLogin();
  if (!res.ok) throw new Error('dashboard data failed: ' + res.status);
  const data = await res.json();
  ASSIGNMENTS = data.assignments.map(a => ({ ...a, due: new Date(a.due) }));
  STUDENTS    = data.students;
  CLASSES     = data.classes;
  SUBMISSIONS = {};
  for (const [key, subs] of Object.entries(data.submissions)) {
    SUBMISSIONS[key] = subs.map(s => ({ ...s, ts: new Date(s.ts) }));
  }
}

// ── Helpers ───────────────────────────────────────────────────────────────────

function total(sub) { return sub.pq + sub.su + sub.cs + sub.oc; }

// Plain language leads, SAMR rides as a subtitle only — never the primary
// label. Same rule the report follows; wording here is the teacher-facing
// set from the v8 roster mock (third person, describing a student's pattern
// rather than coaching them directly).
const BAND_PLAIN = {
  1: 'Taking what it gives',
  2: 'Steering a little',
  3: 'Reshaping the answer',
  4: 'Going past the answer',
};
const SAMR_NAMES = ['Substitution', 'Augmentation', 'Modification', 'Redefinition'];

function samr(t) {
  const n = t >= 17 ? 4 : t >= 13 ? 3 : t >= 9 ? 2 : 1;
  return { n, label: SAMR_NAMES[n - 1], plain: BAND_PLAIN[n] };
}

function bandChip(t, small) {
  const b = samr(t);
  return `<span class="band band-${b.n}"${small ? ' style="font-size:10px"' : ''}><i class="band-pip"></i>${b.plain}</span>`;
}

function submissionStatus(subs, assignment) {
  if (!subs.length) return assignment.status === 'closed'
    ? { label: 'Missing',     cls: 'chip-attention' }
    : { label: 'Not started', cls: 'chip-grey'      };
  return assignment.status === 'closed'
    ? { label: 'Final', cls: 'chip-positive' }
    : { label: 'Draft', cls: 'chip-caution'  };
}

const FLAG_META = {
  'stylistic-inconsistency': {
    short: 'Stylistic inconsistency',
    desc: 'Vocabulary and complexity shifts sharply between student turns',
    what: 'The student\'s writing shows significant jumps in vocabulary, sentence complexity, or tone between turns — beyond what normal drafting usually produces.',
    why: 'These shifts can indicate that text from an external source was introduced mid-session rather than composed in place. Natural revision tends to evolve gradually; abrupt changes are harder to explain by the conversation alone.',
    steps: [
      'Compare the flagged turn directly against surrounding turns and look for abrupt tone or vocabulary shifts.',
      'Ask the student to explain their reasoning in the flagged section in their own words.',
      'Consider whether the shift aligns with a new topic or a genuine change in approach — those are expected and fine.',
    ],
  },
  'unnatural-fluency': {
    short: 'Unnatural fluency',
    desc: 'Student turns lack the hedging and false starts typical of live composition',
    what: 'The student\'s turns read as polished and certain throughout — no hedging phrases ("I think", "maybe", "not sure if"), no self-corrections, no colloquial language. This pattern is unusual for in-session writing.',
    why: 'Live composition typically includes uncertainty markers and self-correction. Uniformly high fluency may suggest the student was submitting pre-composed or AI-generated text as their own prompts rather than thinking out loud in real time.',
    steps: [
      'Look at whether the student turns read more like essay prose than conversational thinking-out-loud.',
      'Ask the student to walk you through how they arrived at a specific turn in their own words.',
      'A low-stakes verbal check-in is often enough to clarify whether the student genuinely engaged with the material.',
    ],
  },
  'provenance-mismatch': {
    short: 'Provenance mismatch',
    desc: 'A concept appears in the essay as student-originated but the AI introduced it first',
    what: 'The provenance analysis found that an idea credited in the essay to the student\'s own thinking was actually introduced by the AI earlier in the conversation.',
    why: 'This doesn\'t automatically mean the student acted in bad faith — they may have genuinely absorbed and reframed the idea. But it warrants a closer look when the essay presents the concept as independently derived.',
    steps: [
      'Identify the specific concept in the chat log and in the essay.',
      'Ask the student when and how they first encountered that idea.',
      'This can be a teaching moment: discuss the difference between internalising a concept and independently originating one.',
    ],
  },
  'shadow-session-pattern': {
    short: 'Shadow session pattern',
    desc: 'Student responses are well-calibrated to AI output with very little pushback',
    what: 'The student\'s turns show very high passive acceptance of AI suggestions and almost no challenge, rejection, or refinement. The interaction pattern resembles a student who arrived with polished inputs rather than composing in real time.',
    why: 'Genuine AI-assisted writing involves friction — students push back, redirect, and question. An unusually smooth acceptance pattern may indicate the AI session was staged after the actual writing was done elsewhere.',
    steps: [
      'Review the ratio of extraction and validation turns against challenge and refinement turns in the TAU breakdown.',
      'Ask the student to describe a moment where they disagreed with or changed something the AI suggested.',
      'This flag is more significant when paired with Unnatural Fluency — both together strengthen the concern.',
    ],
  },
  'score-spike': {
    short: 'Score spike',
    desc: 'TAU score increased sharply between two submissions in a short window',
    what: 'Two submissions were made within a short time window, but the TAU score jumped significantly — more than would be expected from a normal revision cycle.',
    why: 'Rapid score improvement can indicate that the student submitted an initial draft, then quickly replaced it with a substantially different session — possibly one prepared in advance or generated with different inputs.',
    steps: [
      'Compare the two submissions side by side using the scores and timestamps above.',
      'Ask the student what changed between the two versions and why they resubmitted so quickly.',
      'A spike on a single dimension is less concerning than a broad jump across all four.',
    ],
  },
  'reflection-score-mismatch': {
    short: 'Reflection–Score Gap',
    desc: "Student described pushback or prior knowledge the scores don't show",
    what: "The student's reflection described challenging or disagreeing with the AI, or claimed strong prior knowledge — but their scores tell a different story. Their Calibrated Skepticism or Original Contribution score was low, suggesting little actual pushback or independent contribution occurred in the session.",
    why: "The reflection contained language associated with critical engagement (\"pushed back\", \"challenged\", \"disagreed\", \"already knew\") while the corresponding score was below 2.5. This mismatch may mean the student overestimated their own engagement, or they understand what good process looks like without yet having the habit of acting on it.",
    steps: [
      "Read the student's reflection challenge response alongside their actual session log.",
      "Ask the student to point to a specific moment in the chat where they disagreed with the AI — if they can\'t, that\'s informative.",
      "This is often a teaching opportunity: the student may have the right instincts but not yet the habit of acting on them in real time.",
    ],
  },
  'reflection-delta-mismatch': {
    short: 'Delta–Score Mismatch',
    desc: "Student described improvement in their follow-up reflection but scores didn't change",
    what: "The student's \"What shifted?\" reflection described becoming more critical, skeptical, or independent in how they used the AI — but their TAU scores did not increase between submissions.",
    why: "The delta reflection contained improvement language (\"more skeptical\", \"pushed back more\", \"more critical\") while the total score stayed the same or decreased. This suggests the student may be describing the behavior they intended rather than the behavior they demonstrated.",
    steps: [
      "Look at the specific dimension scores the student implicitly claimed to improve — CS if they mentioned skepticism, OC if they mentioned more independent thinking.",
      "Ask the student what specific change they made to their process, and whether they can point to it in the chat log.",
      "Consider whether the student is reflecting on intent rather than action — this is common and addressable with a brief one-on-one conversation.",
    ],
  },
};

// ── Behavioral trend definitions ──────────────────────────────────────────────

const TREND_META = {
  passive: {
    label: 'Passive AI engagement',
    shortDesc: 'Accepting AI output without questioning or building on it',
    what: 'These students are using AI as an answer source rather than a thinking partner. They validate and extract rather than challenge and refine — the AI leads the conversation, not the student. Low scores on both Prompting Quality and Calibrated Skepticism reinforce each other: neither the questions nor the follow-through show critical ownership.',
    whatToTry: 'Before the next assignment, ask students to write one position they expect to disagree with the AI about, then bring that disagreement to a short class discussion. Even mild pushback reactivates critical ownership and shifts the dynamic from passive receipt to active negotiation.',
  },
  'low-skepticism': {
    label: 'Low critical evaluation',
    shortDesc: 'Asking questions but rarely challenging or refining the answers received',
    what: 'These students engage with the AI but tend to accept the framing they receive. They ask questions, but when the AI responds, they move on rather than pushing back or probing further. The AI\'s logic becomes the student\'s logic without much examination.',
    whatToTry: 'Introduce a "challenge requirement" for the next assignment: each AI session must include at least two logged moments where the student explicitly questions or reframes what the AI said. Making skepticism a visible, trackable part of the task tends to surface it naturally.',
  },
  'ai-ideas': {
    label: 'AI-originated ideas',
    shortDesc: 'Essay ideas trace back to AI output rather than the student\'s own thinking',
    what: 'These students are building their essays on ideas the AI suggested, not ideas they developed independently. They may understand the content well, but the intellectual ownership hasn\'t transferred — the argument structure reflects what the AI proposed, not what the student chose.',
    whatToTry: 'Try a "pre-AI freewrite" protocol: 10 minutes of unstructured notes on the topic before opening the AI tool. Students who arrive with a rough position use AI to develop their thinking; students who arrive blank tend to adopt the AI\'s position. The freewrite is the difference.',
  },
  declining: {
    label: 'Declining engagement',
    shortDesc: 'Critical thinking scores dropping across recent submissions',
    what: 'These students started with more active engagement patterns but their scores have fallen across submissions. They may be fatiguing on the task, defaulting to easier extraction habits as the deadline approaches, or losing interest in the topic.',
    whatToTry: 'A short 1:1 check-in is usually the most efficient intervention — the cause varies widely. Time pressure, topic difficulty, and loss of interest each call for different responses. Early conversation prevents the pattern from becoming a default.',
  },
};

const REASON_TO_TREND = {
  'Passive engagement across all submissions':         'passive',
  'Tends to accept AI responses without questioning':  'passive',
  'Rarely challenges or refines AI suggestions':       'low-skepticism',
  'Most ideas appear AI-initiated':                    'ai-ideas',
  'Engagement declining across recent submissions':    'declining',
};

function detectTrends() {
  const allStudents = CLASSES.flatMap(cls =>
    cls.studentIds.map(sid => ({ student: STUDENTS.find(x => x.id === sid), cls }))
  ).filter(({ student }) => student);

  const groups = {};
  allStudents.forEach(({ student, cls }) => {
    const sig = getStudentSignal(student.id);
    if (sig.status !== 'attention') return;
    const tid = REASON_TO_TREND[sig.reason];
    if (!tid) return;
    if (!groups[tid]) groups[tid] = [];
    groups[tid].push({ student, cls });
  });

  return Object.entries(groups)
    .filter(([, arr]) => arr.length >= 2)
    .sort((a, b) => b[1].length - a[1].length)
    .map(([id, students]) => ({ id, students, meta: TREND_META[id] }))
    .filter(t => t.meta);
}

function checkFlag(subs) {
  const flags = [];
  for (let i = 1; i < subs.length; i++) {
    const prev = subs[i-1], curr = subs[i];
    const mins      = (curr.ts - prev.ts) / 60000;
    const scoreDiff = total(curr) - total(prev);
    const maxDim    = Math.max(...['pq','su','cs','oc'].map(d => curr[d] - prev[d]));
    if (mins <= 10 && (scoreDiff >= 5 || maxDim >= 3)) {
      flags.push({ submissionIndex: i, mins: Math.round(mins), scoreDiff, maxDim });
    }
  }
  return flags;
}

function getSubs(sid, aid)      { return SUBMISSIONS[`${sid}_${aid}`] || []; }
function latestSub(subs)        { return subs.length ? subs[subs.length - 1] : null; }
function getIntegrityFlags(subs){ return [...new Set(subs.flatMap(s => s.integrityFlags || []))]; }

function hasAnyFlag(sid) {
  return ASSIGNMENTS.some(a => {
    const subs = getSubs(sid, a.id);
    return checkFlag(subs).length > 0 || getIntegrityFlags(subs).length > 0;
  });
}

function getStudentSignal(studentId, assignmentId = null) {
  const assignments = assignmentId
    ? [ASSIGNMENTS.find(a => a.id === assignmentId)].filter(Boolean)
    : ASSIGNMENTS;

  const integrityKeys = [];
  let hasSpikeFlag = false;

  assignments.forEach(a => {
    const subs = getSubs(studentId, a.id);
    getIntegrityFlags(subs).forEach(f => { if (!integrityKeys.includes(f)) integrityKeys.push(f); });
    if (checkFlag(subs).length) hasSpikeFlag = true;
  });

  if (integrityKeys.length || hasSpikeFlag) {
    const has = k => integrityKeys.includes(k);
    let reason;
    if (has('shadow-session-pattern') && has('unnatural-fluency')) {
      reason = 'Multiple integrity signals — consider a conversation';
    } else if (has('shadow-session-pattern')) {
      reason = 'Unusually passive acceptance pattern';
    } else if (has('unnatural-fluency')) {
      reason = 'Writing style inconsistent with live composition';
    } else if (has('stylistic-inconsistency')) {
      reason = 'Vocabulary shifts sharply between turns';
    } else if (has('provenance-mismatch')) {
      reason = 'Essay credits ideas the AI introduced first';
    } else {
      reason = 'Score jumped sharply between two submissions';
    }
    return { status: 'review', reason };
  }

  const allSubs = assignments.flatMap(a => getSubs(studentId, a.id));
  if (!allSubs.length) return { status: 'on-track', reason: '' };

  const avg = dim => allSubs.reduce((s, sub) => s + sub[dim], 0) / allSubs.length;
  const avgPQ    = avg('pq');
  const avgCS    = avg('cs');
  const avgOC    = avg('oc');
  const avgTotal = allSubs.reduce((s, sub) => s + total(sub), 0) / allSubs.length;

  const sorted   = [...allSubs].sort((a, b) => a.ts - b.ts);
  const declining = sorted.length >= 3 && total(sorted[sorted.length - 1]) < total(sorted[0]) - 2;

  if (declining)              return { status: 'attention', reason: 'Engagement declining across recent submissions' };
  if (avgTotal < 9)           return { status: 'attention', reason: 'Passive engagement across all submissions' };
  if (avgCS < 2.5 && avgPQ < 2.5) return { status: 'attention', reason: 'Tends to accept AI responses without questioning' };
  if (avgCS < 2.5)            return { status: 'attention', reason: 'Rarely challenges or refines AI suggestions' };
  if (avgOC < 2.5)            return { status: 'attention', reason: 'Most ideas appear AI-initiated' };

  const PUSHBACK_KW    = ['disagreed', 'pushed back', 'challenged', 'wrong', "didn't think", 'questioned', 'asked it to reconsider'];
  const IMPROVEMENT_KW = ['more skeptical', 'pushed back more', 'more critical', 'less reliant', 'questioned more', 'challenged more'];

  for (const a of assignments) {
    const subs = getSubs(studentId, a.id);
    for (let i = 0; i < subs.length; i++) {
      const sub = subs[i];
      if (sub.reflectionType === 'full' && sub.reflection) {
        const challenge = (sub.reflection.challenge || '').toLowerCase();
        if (sub.cs < 2.5 && PUSHBACK_KW.some(kw => challenge.includes(kw))) {
          return { status: 'attention', reason: 'Reflection claims pushback the scores don\'t show', learnMoreKey: 'reflection-score-mismatch' };
        }
      }
      if (i > 0 && sub.reflectionType === 'delta' && sub.reflection) {
        const delta = (sub.reflection.delta || '').toLowerCase();
        if (total(sub) <= total(subs[i - 1]) && IMPROVEMENT_KW.some(kw => delta.includes(kw))) {
          return { status: 'attention', reason: 'Student described improvement but scores didn\'t change', learnMoreKey: 'reflection-delta-mismatch' };
        }
      }
    }
  }

  return { status: 'on-track', reason: '' };
}

function formatDate(d) {
  return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' })
    + ' ' + d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', hour12: true });
}

function distributionBar(studentIds, assignmentId, w = 120, h = 10) {
  const n = studentIds.length;
  if (!n) return '';
  const counts = { Redefinition: 0, Modification: 0, Augmentation: 0, Substitution: 0, None: 0 };
  studentIds.forEach(sid => {
    const lat = latestSub(getSubs(sid, assignmentId));
    if (lat) counts[samr(total(lat)).label]++;
    else counts.None++;
  });
  const colors = { Redefinition: 'var(--tau-band-4-fg)', Modification: 'var(--tau-band-3-fg)', Augmentation: 'var(--tau-band-2-fg)', Substitution: 'var(--tau-band-1-fg)' };
  const levels = ['Redefinition', 'Modification', 'Augmentation', 'Substitution'];
  let x = 0;
  const rects = [];
  levels.forEach(l => {
    if (!counts[l]) return;
    const sw = (counts[l] / n) * w;
    rects.push(`<rect x="${x.toFixed(1)}" y="0" width="${sw.toFixed(1)}" height="${h}" fill="${colors[l]}"><title>${counts[l]} ${l}</title></rect>`);
    x += sw;
  });
  if (x < w - 0.5) {
    rects.push(`<rect x="${x.toFixed(1)}" y="0" width="${(w - x).toFixed(1)}" height="${h}" fill="var(--tau-surface-3)"><title>${counts.None} not submitted</title></rect>`);
  }
  return `<svg width="${w}" height="${h}" style="border-radius:3px;display:block;overflow:hidden">${rects.join('')}</svg>`;
}

// ── Drill panel ───────────────────────────────────────────────────────────────

function reflectionArc(subs) {
  if (!subs.some(s => s.reflection)) return '';
  const entries = subs.map((sub, i) => {
    const t = total(sub);
    const isFull = sub.reflectionType === 'full';
    const text = isFull
      ? (sub.reflection?.connect || '')
      : (sub.reflection?.delta || '');
    const words = text.trim().split(/\s+/).slice(0, 5).join(' ');
    const excerpt = words + (text.trim().split(/\s+/).length > 5 ? '…' : '');
    const badge = isFull ? 'CEC' : 'Δ';
    const badgeCls = isFull ? 'chip-neutral' : 'chip-caution';
    return `<div class="arc-entry" onclick="this.closest('.sub-history').children[${subs.length - 1 - i}].scrollIntoView({behavior:'smooth',block:'nearest'})">
      <span class="arc-badge ${badgeCls}">${badge}</span>
      <span class="arc-excerpt">${excerpt}</span>
      <span class="arc-score">${t}/20</span>
    </div>`;
  });
  return `<div class="reflection-arc">
    <div class="arc-label">Reflection arc</div>
    <div class="arc-entries">${entries.join('<span class="arc-arrow">→</span>')}</div>
  </div>`;
}

function renderReflectionSection(sub, prevSub) {
  if (!sub.reflection) return '';
  const isFull = sub.reflectionType === 'full';
  let badgeLabel, scoreDelta = '', fullContent;

  if (isFull) {
    badgeLabel = 'Connect · Extend · Challenge';
    fullContent = `
      <div class="reflect-section"><span class="reflect-label">Connect</span>${sub.reflection.connect || ''}</div>
      <div class="reflect-section"><span class="reflect-label">Extend</span>${sub.reflection.extend || ''}</div>
      <div class="reflect-section"><span class="reflect-label">Challenge</span>${sub.reflection.challenge || ''}</div>`;
  } else {
    badgeLabel = 'What shifted?';
    if (prevSub) {
      const change = total(sub) - total(prevSub);
      const cls = change > 0 ? 'chip-positive' : change < 0 ? 'chip-attention' : 'chip-grey';
      const sign = change > 0 ? '+' : '';
      scoreDelta = `<span class="score-delta ${cls}">${sign}${change}</span>`;
    }
    fullContent = `<div class="reflect-section">${sub.reflection.delta || ''}</div>`;
  }

  const excerptSrc = isFull ? (sub.reflection.challenge || sub.reflection.connect || '') : (sub.reflection.delta || '');
  const excerptWords = excerptSrc.trim().split(/\s+/).slice(0, 10).join(' ');
  const excerpt = excerptWords + (excerptSrc.trim().split(/\s+/).length > 10 ? '…' : '');
  const badgeCls = isFull ? 'chip-neutral' : 'chip-caution';

  return `<details class="reflection-details">
    <summary class="reflection-summary">
      <span class="reflect-type-badge ${badgeCls}">${badgeLabel}</span>
      ${scoreDelta}
      <span class="reflect-excerpt">${excerpt}</span>
    </summary>
    <div class="reflect-full">${fullContent}</div>
  </details>`;
}

function renderDrillPanel(subs, label, sig, ctx) {
  if (!subs.length) return `<div class="drill-panel"><em style="color:var(--tau-ink-soft);font-size:13px">No submissions for this assignment.</em></div>`;
  const flags   = checkFlag(subs);
  const flagIdx = new Set(flags.map(f => f.submissionIndex));
  const rows = [...subs].reverse().map((sub, ri) => {
    const i = subs.length - 1 - ri;
    const t        = total(sub);
    const flagInfo = flagIdx.has(i) ? flags.find(f => f.submissionIndex === i) : null;
    const iFlags   = sub.integrityFlags || [];
    const isLast   = i === subs.length - 1;
    const prevSub  = i > 0 ? subs[i - 1] : null;

    const flagLines = [];
    if (flagInfo) {
      flagLines.push(`<div class="flag-line">
        <span>Score jumped +${flagInfo.scoreDiff} points in ${flagInfo.mins} minutes</span>
        <a class="flag-learn-more" onclick="openFlagTray('score-spike',{scoreDiff:${flagInfo.scoreDiff},mins:${flagInfo.mins}});event.stopPropagation()">Learn more</a>
      </div>`);
    }
    iFlags.forEach(f => {
      flagLines.push(`<div class="flag-line">
        <span>${FLAG_META[f]?.desc || f}</span>
        <a class="flag-learn-more" onclick="openFlagTray('${f}');event.stopPropagation()">Learn more</a>
      </div>`);
    });

    const flagRow = flagLines.length
      ? `<div class="integrity-flags-row">
           <span class="flagdot" style="margin-top:3px"><i class="dot dot-caution"></i></span>
           <div style="flex:1;display:flex;flex-direction:column;gap:3px">${flagLines.join('')}</div>
         </div>`
      : '';

    const statusChip = isLast
      ? `<span class="sub-chip" style="font-size:10px;font-weight:600;color:var(--tau-positive);background:var(--tau-positive-bg);padding:2px 7px;border-radius:20px">Final</span>`
      : `<span class="sub-chip" style="font-size:10px;font-weight:600;color:var(--tau-ink-soft);background:var(--tau-surface-2);border:1px solid var(--tau-line);padding:2px 7px;border-radius:20px">Draft</span>`;

    return `<div class="sub-row ${flagInfo || iFlags.length ? 'flagged' : ''}">
      <div class="sub-row-main">
        <span class="sub-num">#${i + 1}</span>
        ${statusChip}
        <span class="sub-date">${formatDate(sub.ts)}</span>
        <span class="sub-total">${t}<span style="font-size:11px;font-weight:400;color:var(--tau-ink-soft)">/20</span></span>
        <div class="dim-scores" style="flex:1">
          <span class="dim-score">PQ <span>${sub.pq}</span></span>
          <span class="dim-score">SU <span>${sub.su}</span></span>
          <span class="dim-score">CS <span>${sub.cs}</span></span>
          <span class="dim-score">OC <span>${sub.oc}</span></span>
        </div>
        <span style="min-width:150px;flex-shrink:0">${bandChip(t, true)}</span>
        ${sub.id ? `<a href="/report.html?id=${sub.id}&role=teacher" target="_blank" onclick="event.stopPropagation()" style="font-size:11px;flex-shrink:0;color:var(--tau-forest)">Report →</a>` : ''}
      </div>
      ${flagRow}
      ${renderReflectionSection(sub, prevSub)}
    </div>`;
  }).join('');

  const learnMoreLink = sig && sig.learnMoreKey
    ? ` <a class="flag-learn-more" onclick="openFlagTray('${sig.learnMoreKey}');event.stopPropagation()">Learn more</a>`
    : '';
  const engagementNote = sig && sig.status === 'attention' && sig.reason
    ? `<div style="padding:8px 14px;font-size:11px;color:var(--tau-ink-soft);border-top:1px solid var(--tau-line)">${sig.reason}${learnMoreLink}</div>`
    : '';

  const convLink = ctx
    ? `<a href="/teacher.html#student/${ctx.assignmentId}/${ctx.studentId}" target="_blank" onclick="event.stopPropagation()" style="font-size:11px;float:right;color:var(--tau-forest)">Session view →</a>`
    : '';

  return `<div class="drill-panel">
    <div class="drill-panel-header">Submission history — ${label}${convLink}</div>
    ${reflectionArc(subs)}
    <div class="sub-history">${rows}</div>
    ${engagementNote}
  </div>`;
}

// ── State ─────────────────────────────────────────────────────────────────────

let activeTab            = 'overview';
let activeClass          = 'overview';
let activeAssignment     = 'overview';
let activeStudent        = 'overview';
let studentSearch        = '';
let studentFilter        = 'all';
let expandedInAssignment = null;
let expandedInClass      = null;
let expandedInStudent    = null;
let classSort            = { col: null,   dir: 'asc' };
let assignmentSort       = { col: 'name', dir: 'asc' };

// ── Sidebar renders ───────────────────────────────────────────────────────────

function renderClassSidebar() {
  const items = CLASSES.map(c => {
    const students = c.studentIds.map(sid => STUDENTS.find(s => s.id === sid)).filter(Boolean);
    const hasFlags = students.some(s => hasAnyFlag(s.id));
    const active   = c.id === activeClass;
    return `<div class="sidebar-item ${active ? 'active' : ''}" onclick="selectClass('${c.id}')">
      <div style="flex:1;min-width:0">
        <div class="sidebar-item-name">${c.name}</div>
        <div class="sidebar-item-sub">${students.length} student${students.length !== 1 ? 's' : ''}</div>
      </div>
      ${hasFlags ? '<span class="dot dot-caution"></span>' : ''}
    </div>`;
  }).join('');
  return `<div class="sidebar-item ${activeClass === 'overview' ? 'active' : ''}" onclick="selectClass('overview')" style="margin-bottom:4px">
    <div style="flex:1;min-width:0">
      <div class="sidebar-item-name">Overview</div>
      <div class="sidebar-item-sub">All classes at a glance</div>
    </div>
  </div>
  <div style="height:1px;background:var(--tau-line);margin:4px 0 8px"></div>
  ${items}`;
}

function renderAssignmentSidebar() {
  function item(a) {
    const active   = a.id === activeAssignment;
    const dueStr   = a.due.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
    const hasFlags = STUDENTS.some(s => {
      const subs = getSubs(s.id, a.id);
      return checkFlag(subs).length > 0 || getIntegrityFlags(subs).length > 0;
    });
    return `<div class="sidebar-item ${active ? 'active' : ''}" onclick="selectAssignment('${a.id}')">
      <div style="flex:1;min-width:0">
        <div class="sidebar-item-name">${a.name}</div>
        <div class="sidebar-item-sub">Due ${dueStr}</div>
      </div>
      ${hasFlags ? '<span class="dot dot-caution"></span>' : ''}
    </div>`;
  }
  const open   = ASSIGNMENTS.filter(a => a.status === 'open');
  const closed = ASSIGNMENTS.filter(a => a.status === 'closed');
  let items = '';
  if (open.length)   items += `<div class="sidebar-section">Open</div>${open.map(item).join('')}`;
  if (closed.length) items += `<div class="sidebar-section" style="margin-top:${open.length ? 4 : 0}px">Closed</div>${closed.map(item).join('')}`;
  return `<div class="sidebar-item ${activeAssignment === 'overview' ? 'active' : ''}" onclick="selectAssignment('overview')" style="margin-bottom:4px">
    <div style="flex:1;min-width:0">
      <div class="sidebar-item-name">Overview</div>
      <div class="sidebar-item-sub">All assignments at a glance</div>
    </div>
  </div>
  <div style="height:1px;background:var(--tau-line);margin:4px 0 8px"></div>
  ${items}`;
}

function signalPill(sig) {
  if (sig.status === 'review') return `<span class="signal-pill-review">Worth a chat</span>`;
  return '';
}

function studentSidebarItem(s) {
  const active = s.id === activeStudent;
  const sig    = getStudentSignal(s.id);
  return `<div class="sidebar-item ${active ? 'active' : ''}" onclick="selectStudent('${s.id}')">
    <div style="flex:1;min-width:0">
      <div class="sidebar-item-name">${s.name}</div>
    </div>
    ${signalPill(sig)}
  </div>`;
}

function renderStudentList() {
  const q = studentSearch.toLowerCase().trim();

  let candidates = CLASSES.flatMap(cls =>
    cls.studentIds.map(sid => ({ student: STUDENTS.find(s => s.id === sid), cls }))
  ).filter(({ student }) => student);

  if (q) candidates = candidates.filter(({ student }) => student.name.toLowerCase().includes(q));

  if (studentFilter !== 'all') {
    candidates = candidates.filter(({ student }) => getStudentSignal(student.id).status === studentFilter);
  }

  if (!candidates.length) return `<div style="padding:10px 16px;font-size:12px;color:var(--tau-ink-soft)">No students match this filter</div>`;

  if (q) {
    return candidates.map(({ student }) => studentSidebarItem(student)).join('');
  }

  return CLASSES.map(cls => {
    const classStudents = candidates.filter(c => c.cls.id === cls.id).map(c => c.student);
    if (!classStudents.length) return '';
    return `<div class="sidebar-section">${cls.name}</div>`
      + classStudents.map(s => studentSidebarItem(s)).join('');
  }).join('');
}

function renderStudentSidebar() {
  return `<div class="sidebar-item ${activeStudent === 'overview' ? 'active' : ''}" onclick="selectStudent('overview')" style="margin-bottom:4px">
      <div style="flex:1;min-width:0">
        <div class="sidebar-item-name">Overview</div>
        <div class="sidebar-item-sub">All students by priority</div>
      </div>
    </div>
    <div style="height:1px;background:var(--tau-line);margin:4px 0 8px"></div>
    <div class="sidebar-search">
      <input type="text" id="student-search-input" placeholder="Search students…"
             oninput="filterStudents(this.value)" value="${studentSearch}">
    </div>
    <div class="filter-chips">
      <button class="filter-chip ${studentFilter === 'all'    ? 'active-all'    : ''}" data-filter="all"    onclick="setStudentFilter('all')">All</button>
      <button class="filter-chip ${studentFilter === 'review' ? 'active-review' : ''}" data-filter="review" onclick="setStudentFilter('review')">Worth a chat</button>
    </div>
    <div id="student-list">${renderStudentList()}</div>`;
}

function renderSidebar() {
  const el = document.getElementById('sidebar');
  if      (activeTab === 'class')      el.innerHTML = renderClassSidebar();
  else if (activeTab === 'assignment') el.innerHTML = renderAssignmentSidebar();
  else                                  el.innerHTML = renderStudentSidebar();
}

// ── Class drill panel ─────────────────────────────────────────────────────────

function renderClassDrillPanel(a, students) {
  const isClosed = a.status === 'closed';

  const noSubs   = students.filter(s => getSubs(s.id, a.id).length === 0);
  const hasSubs  = students.filter(s => getSubs(s.id, a.id).length > 0);

  // Unsubmitted always at top; within each group keep original roster order
  const ordered = [...noSubs, ...hasSubs];

  const rows = ordered.map(s => {
    const subs      = getSubs(s.id, a.id);
    const lat       = latestSub(subs);
    const t         = lat ? total(lat) : null;
    const st        = submissionStatus(subs, a);
    const sig       = getStudentSignal(s.id, a.id);
    const isMissing = isClosed && !subs.length;

    return `<div class="class-student-row ${isMissing ? 'missing' : ''}"
                 onclick="gotoStudentFromClass('${s.id}');event.stopPropagation()">
      <div class="avatar" style="width:24px;height:24px;font-size:10px;flex-shrink:0">${s.initials}</div>
      <div style="flex:1;min-width:0">
        <div style="font-size:13px;font-weight:500;display:flex;align-items:center;gap:6px">
          ${s.name}
          ${signalPill(sig)}
        </div>
      </div>
      <span class="chip ${st.cls}" style="font-size:10px;flex-shrink:0">${st.label}</span>
      ${t !== null
        ? `<span style="font-weight:700;font-size:13px;min-width:36px;text-align:right;flex-shrink:0">${t}<span style="font-size:11px;font-weight:400;color:var(--tau-ink-soft)">/20</span></span>
           <span style="min-width:140px;flex-shrink:0">${bandChip(t, true)}</span>`
        : `<span style="min-width:36px"></span><span style="min-width:140px"></span>`}
    </div>`;
  }).join('');

  return `<div class="drill-panel">
    <div class="drill-panel-header" style="display:flex;justify-content:space-between;align-items:center">
      <span>Students — ${a.name}</span>
      <a style="font-size:11px;font-weight:600;color:var(--tau-forest);cursor:pointer;text-decoration:none"
         onclick="gotoAssignment('${a.id}');event.stopPropagation()">View full assignment →</a>
    </div>
    <div style="display:flex;flex-direction:column;gap:2px">${rows}</div>
  </div>`;
}

// ── Content renders ───────────────────────────────────────────────────────────

function renderOverviewContent() {
  const allStudents = CLASSES.flatMap(cls =>
    cls.studentIds.map(sid => ({ student: STUDENTS.find(x => x.id === sid), cls }))
  ).filter(({ student }) => student);

  const review     = allStudents.filter(({ student }) => getStudentSignal(student.id).status === 'review');
  const trends     = detectTrends();
  const openAssign = ASSIGNMENTS.filter(a => a.status === 'open');
  const totalMissing = openAssign.reduce((sum, a) =>
    sum + allStudents.filter(({ student }) => !getSubs(student.id, a.id).length).length, 0);

  // ── Stat tiles ──
  function statTile(value, label, color, tintBg, borderColor, onclickFn) {
    return `<div class="stat-tile${onclickFn ? ' stat-tile-clickable' : ''}" style="background:${tintBg};border:1px solid ${borderColor}" ${onclickFn ? `onclick="${onclickFn}"` : ''}>
      <div class="stat-tile-val" style="color:${color}">${value}</div>
      <div class="stat-tile-label" style="color:${color}">${label}</div>
    </div>`;
  }

  const softBorder = c => `color-mix(in oklab, ${c} 35%, var(--tau-surface))`;

  const tiles = `<div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:24px">
    ${statTile(
      review.length,
      review.length ? 'Worth a chat' : 'No signals',
      review.length ? 'var(--tau-caution)' : 'var(--tau-positive)',
      review.length ? 'var(--tau-caution-bg)' : 'var(--tau-positive-bg)',
      review.length ? softBorder('var(--tau-caution)') : softBorder('var(--tau-positive)'),
      review.length ? "gotoStudentFilter('review')" : ''
    )}
    ${statTile(trends.length, `Behavioral pattern${trends.length !== 1 ? 's' : ''} detected`, 'var(--tau-band-3-fg)', 'var(--tau-band-3-bg)', softBorder('var(--tau-band-3-fg)'), '')}
    ${totalMissing ? statTile(totalMissing, 'Missing submissions', 'var(--tau-attention)', 'var(--tau-attention-bg)', softBorder('var(--tau-attention)'), '') : ''}
    ${statTile(openAssign.length, `Open assignment${openAssign.length !== 1 ? 's' : ''}`, 'var(--tau-ink-soft)', 'var(--tau-surface)', 'var(--tau-line)', '')}
    ${statTile(allStudents.length, 'Students', 'var(--tau-ink-soft)', 'var(--tau-surface)', 'var(--tau-line)', '')}
  </div>`;

  // ── Worth a chat list ──
  const reviewSection = review.length ? `<div style="margin-bottom:20px">
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">
      <span style="font-size:13px;font-weight:600;color:var(--tau-ink)">Students — <span class="signal-pill-review">Worth a chat</span></span>
      <span style="font-size:11px;background:var(--tau-caution-bg);color:var(--tau-caution);border:1px solid ${softBorder('var(--tau-caution)')};border-radius:20px;padding:1px 7px;font-weight:600">${review.length}</span>
    </div>
    <div style="background:var(--tau-surface);border:1px solid var(--tau-line);border-radius:8px;overflow:hidden">
      ${review.map(({ student, cls }, i) => {
        const flaggedAssign = ASSIGNMENTS.filter(a => {
          const subs = getSubs(student.id, a.id);
          return checkFlag(subs).length > 0 || getIntegrityFlags(subs).length > 0;
        });
        const detail = flaggedAssign.length ? 'Noted on: ' + flaggedAssign.map(a => a.name).join(', ') : '';
        return `<div class="list-row" style="${i > 0 ? 'border-top:1px solid var(--tau-line);' : ''}"
                     onclick="gotoStudentFromClass('${student.id}')">
          <div class="avatar avatar-sm">${student.initials}</div>
          <div style="flex:1;min-width:0">
            <div class="list-row-name">${student.name}</div>
            <div class="list-row-meta">${cls.name}${detail ? ' · ' + detail : ''}</div>
          </div>
          <span class="list-row-action">View →</span>
        </div>`;
      }).join('')}
    </div>
  </div>` : '';

  // ── Trend cards ──
  const trendsSection = trends.length ? `<div>
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">
      <span style="font-size:13px;font-weight:700;color:var(--tau-ink)">Behavioral patterns</span>
      <span style="font-size:11px;color:var(--tau-ink-soft)">Patterns detected across your classes based on how students are using AI</span>
    </div>
    <div style="display:flex;flex-direction:column;gap:10px">
      ${trends.map(({ id, students, meta }) => {
        const preview = students.slice(0, 4);
        const overflow = students.length - preview.length;
        // Spread across classes for context
        const classCounts = CLASSES.map(cls => {
          const n = students.filter(x => x.cls.id === cls.id).length;
          return n ? `${cls.name} ${n}` : null;
        }).filter(Boolean).join(' · ');
        return `<div style="background:var(--tau-surface);border:1px solid var(--tau-line);border-left:3px solid var(--tau-band-3-fg);border-radius:8px;padding:16px 18px">
          <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:4px">
            <div>
              <span style="font-size:14px;font-weight:700;color:var(--tau-ink)">${meta.label}</span>
              <span style="font-size:11px;font-weight:600;background:var(--tau-band-3-bg);color:var(--tau-band-3-fg);border:1px solid ${softBorder('var(--tau-band-3-fg)')};border-radius:20px;padding:1px 8px;margin-left:8px">${students.length} student${students.length !== 1 ? 's' : ''}</span>
            </div>
          </div>
          <div style="font-size:12px;color:var(--tau-ink-soft);margin-bottom:12px">${classCounts}</div>

          <div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.6px;color:var(--tau-ink-soft);margin-bottom:5px">What this looks like</div>
          <div style="font-size:13px;color:var(--tau-ink-soft);line-height:1.6;margin-bottom:12px">${meta.what}</div>

          <div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.6px;color:var(--tau-band-3-fg);margin-bottom:5px">What to try</div>
          <div style="font-size:13px;color:var(--tau-ink-soft);line-height:1.6;margin-bottom:14px;padding:10px 12px;background:var(--tau-band-3-bg);border-radius:5px;border-left:2px solid var(--tau-band-3-fg)">${meta.whatToTry}</div>

        </div>`;
      }).join('')}
    </div>
  </div>` : '';

  const allClear = !review.length && !trends.length
    ? `<div style="text-align:center;padding:40px 24px;background:var(--tau-surface);border:1px solid var(--tau-line);border-radius:8px">
        <div style="font-size:22px;margin-bottom:8px">✓</div>
        <div style="font-weight:600;font-size:14px;color:var(--tau-positive)">All students on track</div>
        <div style="font-size:12px;color:var(--tau-ink-soft);margin-top:4px">No signals or behavioral patterns detected</div>

  // ── Open assignments ──

      return `<div style="background:var(--tau-surface);border:1px solid var(--tau-line);border-radius:8px;padding:13px 15px;margin-bottom:8px;cursor:pointer"

            <div style="font-size:11px;color:var(--tau-ink-soft);margin-top:2px">Due ${dueStr} · ${daysLeft >= 0 ? `${daysLeft}d left` : 'Past due'}</div>

          <div style="text-align:right;flex-shrink:0">

            return `<span style="font-size:11px;color:var(--tau-ink-soft)">${cls.name} <strong style="color:var(--tau-ink)">${csub}/${cs.length}</strong></span>`;
          }).join('<span style="color:var(--tau-line);margin:0 3px">·</span>')}
        </div>
      </div>`;
    }).join('') : `<div style="font-size:13px;color:var(--tau-ink-soft);padding:14px;text-align:center;background:var(--tau-surface);border:1px solid var(--tau-line);border-radius:8px">No open assignments</div>`}
  </div>`;

  // ── Class health ──
  const classSection = `<div>
    <div class="eyebrow" style="margin-bottom:8px">Classes</div>
    <div style="display:flex;flex-direction:column;gap:6px">
      ${CLASSES.map(cls => {
        const students   = cls.studentIds.map(sid => STUDENTS.find(s => s.id === sid)).filter(Boolean);
        const flagCount = students.filter(s => getStudentSignal(s.id).status === 'review').length;
        return `<div style="background:var(--tau-surface);border:1px solid var(--tau-line);border-radius:8px;padding:11px 14px;display:flex;align-items:center;gap:12px;cursor:pointer"

          <div style="flex:1;min-width:0">
            <div style="font-size:13px;font-weight:600">${cls.name}</div>
            <div style="font-size:11px;color:var(--tau-ink-soft);margin-top:1px">${students.length} students</div>
          </div>
          <div style="display:flex;gap:5px;align-items:center;flex-shrink:0">

  return `

      <div class="content-title">Overview</div>
      <div class="content-meta">${date}</div>

    ${tiles}

      <div>

        ${allClear}

      <div>
        ${assignSection}
        ${classSection}
      </div>
    </div>
  `;
}

function renderClassOverview() {
  const totalFlags = STUDENTS.filter(s => hasAnyFlag(s.id)).length;
  const totalStudents = STUDENTS.length;

  const cards = CLASSES.map(cls => {
    const students = cls.studentIds.map(sid => STUDENTS.find(s => s.id === sid)).filter(Boolean);

      const submitted = students.filter(s => getSubs(s.id, a.id).length > 0).length;
