  return `
    <div class="content-header">
      <div class="content-title">Classes</div>
      <div class="content-meta">${CLASSES.length} class${CLASSES.length !== 1 ? 'es' : ''} · ${totalStudents} students${totalFlags ? ` · <span class="signal-pill-review">Worth a chat</span>` : ''}</div>
    </div>
    <div style="display:flex;flex-direction:column;gap:8px">${cards}</div>
  `;
}

function renderAssignmentOverview() {
  const allStudents = CLASSES.flatMap(cls =>
    cls.studentIds.map(sid => STUDENTS.find(s => s.id === sid)).filter(Boolean)
  );
  const n = allStudents.length;

  function assignmentCard(a) {
    const dueStr    = a.due.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
    const submitted = allStudents.filter(s => getSubs(s.id, a.id).length > 0).length;
    const missing   = a.status === 'closed' ? n - submitted : 0;
    const flagged   = allStudents.filter(s => {
      const subs = getSubs(s.id, a.id);
      return checkFlag(subs).length > 0 || getIntegrityFlags(subs).length > 0;
    });
    const bar = distributionBar(allStudents.map(s => s.id), a.id, 160);

    const flagLines = flagged.map(s => {
      const sig = getStudentSignal(s.id, a.id);
      return `<div style="display:flex;align-items:center;gap:6px;padding:4px 0;border-top:1px solid var(--tau-line);cursor:pointer;border-radius:4px"
                   onmouseover="this.style.background='var(--tau-hover-surface)'" onmouseout="this.style.background=''"
                   onclick="event.stopPropagation();gotoStudentFromClass('${s.id}')">
        <div class="avatar" style="width:22px;height:22px;font-size:9px;flex-shrink:0">${s.initials}</div>
        <span style="font-size:12px;font-weight:500;flex:1">${s.name}</span>
        ${signalPill(sig)}
        <span class="list-row-action">View →</span>
      </div>`;
    }).join('');

    return `<div class="overview-card" onclick="selectAssignment('${a.id}')">
      <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:12px">
        <div style="flex:1;min-width:0">
          <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
            <span style="font-weight:600;font-size:13px">${a.name}</span>
            <span class="chip ${a.status === 'open' ? 'chip-caution' : 'chip-grey'}" style="font-size:10px">${a.status === 'open' ? 'Open' : 'Closed'}</span>
          </div>
          <div style="font-size:11px;color:var(--tau-ink-soft);margin-top:2px">Due ${dueStr}</div>
        </div>
        <div style="text-align:right;flex-shrink:0">
          <div style="font-size:12px;font-weight:600;color:${missing ? 'var(--tau-attention)' : 'var(--tau-ink)'}">${submitted}<span style="font-weight:400;color:var(--tau-ink-soft)">/${n} submitted</span></div>
          ${missing ? `<div style="font-size:11px;color:var(--tau-attention)">${missing} missing</div>` : ''}
        </div>
      </div>
      <div style="margin-top:10px;display:flex;align-items:center;gap:10px">
        ${bar}
        ${flagged.length ? `<span class="flagdot"><i class="dot dot-caution"></i>Worth a chat</span>` : ''}
      </div>
      ${flagLines ? `<div style="margin-top:4px">${flagLines}</div>` : ''}
    </div>`;
  }

  const open   = ASSIGNMENTS.filter(a => a.status === 'open').sort((a, b) => a.due - b.due);
  const closed = ASSIGNMENTS.filter(a => a.status === 'closed').sort((a, b) => b.due - a.due);

  const totalFlagged = ASSIGNMENTS.reduce((sum, a) => sum + allStudents.filter(s => {
    const subs = getSubs(s.id, a.id);
    return checkFlag(subs).length > 0 || getIntegrityFlags(subs).length > 0;
  }).length, 0);

  let html = '';
  if (open.length)   html += `<div class="eyebrow" style="margin-bottom:8px">Open</div><div style="display:flex;flex-direction:column;gap:6px">${open.map(assignmentCard).join('')}</div>`;
  if (closed.length) html += `<div class="eyebrow" style="margin-top:20px;margin-bottom:8px">Closed</div><div style="display:flex;flex-direction:column;gap:6px">${closed.map(assignmentCard).join('')}</div>`;

  return `
    <div class="content-header">
      <div class="content-title">Assignments</div>
      <div class="content-meta">${ASSIGNMENTS.length} assignments · ${open.length} open${totalFlagged ? ` · <span class="signal-pill-review">Worth a chat</span>` : ''}</div>
    </div>
    ${html}
  `;
}

function renderClassContent() {
  if (activeClass === 'overview') return renderClassOverview();
  const cls = CLASSES.find(x => x.id === activeClass);
  if (!cls) return renderClassOverview();
  const students   = cls.studentIds.map(sid => STUDENTS.find(s => s.id === sid)).filter(Boolean);
  const n          = students.length;
  const openCount  = ASSIGNMENTS.filter(a => a.status === 'open').length;
  const totalFlags = students.filter(s => hasAnyFlag(s.id)).length;

  const byDueDesc = (a, b) => b.due - a.due;
  const open   = sortAssignments(ASSIGNMENTS.filter(a => a.status === 'open').sort(byDueDesc));
  const closed = sortAssignments(ASSIGNMENTS.filter(a => a.status === 'closed').sort(byDueDesc));

  function buildRow(a) {
    const allSubs   = students.map(s => getSubs(s.id, a.id));
    const submitted = allSubs.filter(s => s.length > 0).length;
    const isClosed  = a.status === 'closed';
    const dueStr    = a.due.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
    const missing   = isClosed && submitted < n ? n - submitted : 0;
    const flagCount = students.filter(s => {
      const subs = getSubs(s.id, a.id);
      return checkFlag(subs).length > 0 || getIntegrityFlags(subs).length > 0;
    }).length;
    const bar      = distributionBar(cls.studentIds, a.id);
    const expanded = expandedInClass === a.id;

    const mainRow = `<tr class="row-clickable ${expanded ? 'expanded-row' : ''}" onclick="toggleClassDrill('${a.id}')">
      <td>
        <div style="font-weight:600;font-size:13px">${a.name}</div>
        <div style="font-size:11px;color:var(--tau-ink-soft);margin-top:2px">Due ${dueStr} · ${isClosed ? 'Closed' : 'Open'}</div>
      </td>
      <td class="n">
        <span style="font-weight:600;${isClosed && submitted < n ? 'color:var(--tau-attention)' : ''}">${submitted}</span><span style="color:var(--tau-ink-soft)"> / ${n}</span>
        ${missing ? `<div style="font-size:11px;color:var(--tau-attention);margin-top:2px">${missing} missing</div>` : ''}
      </td>
      <td>${bar}</td>
      <td>${flagCount ? `<span class="flagdot"><i class="dot dot-caution"></i>${flagCount} worth a chat</span>` : '<span class="no-signal">—</span>'}</td>
    </tr>`;

    const drillRow = expanded
      ? `<tr class="drill-row"><td colspan="4" style="padding:0">${renderClassDrillPanel(a, students)}</td></tr>`
      : '';

    return mainRow + drillRow;
  }

  function groupHeader(label) {
    return `<tr class="group-row"><td colspan="4"><span class="group-label">${label}</span></td></tr>`;
  }

  const rows = [
    ...(open.length   ? [groupHeader('Open'),   ...open.map(buildRow)]   : []),
    ...(closed.length ? [groupHeader('Closed'), ...closed.map(buildRow)] : []),
  ].join('');

  const metaParts = [
    `${n} student${n !== 1 ? 's' : ''}`,
    `${ASSIGNMENTS.length} assignment${ASSIGNMENTS.length !== 1 ? 's' : ''}`,
    openCount ? `${openCount} open` : 'all closed',
  ];
  if (totalFlags) metaParts.push(`<span class="signal-pill-review">Worth a chat</span>`);

  return `
    <div class="content-header">
      <div class="content-title">${cls.name}</div>
      <div class="content-meta">${metaParts.join(' · ')}</div>
    </div>
    <div class="tbl-wrap">
    <table class="roster">
      <colgroup>
        <col style="width:auto">
        <col style="width:100px">
        <col style="width:140px">
        <col style="width:120px">
      </colgroup>
      <thead><tr>
        ${sortTh('Assignment',   'name',      classSort)}
        ${sortTh('Submitted',    'submitted', classSort)}
        <th>Class spread</th>
        ${sortTh('Worth a chat', 'flags',     classSort)}
      </tr></thead>
      <tbody>${rows}</tbody>
    </table>
    </div>
    <div class="bar-legend">
      <span>Spread:</span>
      <span><span class="legend-swatch" style="background:var(--tau-band-4-fg)"></span>Going past the answer</span>
      <span><span class="legend-swatch" style="background:var(--tau-band-3-fg)"></span>Reshaping the answer</span>
      <span><span class="legend-swatch" style="background:var(--tau-band-2-fg)"></span>Steering a little</span>
      <span><span class="legend-swatch" style="background:var(--tau-band-1-fg)"></span>Taking what it gives</span>
      <span><span class="legend-swatch" style="background:var(--tau-surface-3)"></span>Not submitted</span>
    </div>
    <p style="margin-top:10px;font-size:12px;color:var(--tau-ink-soft)">Click an assignment to view student breakdown.</p>
  `;
}

function renderAssignmentContent() {
  if (activeAssignment === 'overview') return renderAssignmentOverview();
  const a = ASSIGNMENTS.find(x => x.id === activeAssignment);
  if (!a) return renderAssignmentOverview();
  const closed = a.status === 'closed';
  const dueStr = a.due.toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' });

  const rows = [];
  CLASSES.forEach(cls => {
    const classStudents = sortStudents(
      cls.studentIds.map(sid => STUDENTS.find(s => s.id === sid)).filter(Boolean),
      a
    );
    if (!classStudents.length) return;

    rows.push(`<tr class="group-row"><td colspan="9"><span class="group-label">${cls.name}</span></td></tr>`);

    classStudents.forEach(s => {
      const subs     = getSubs(s.id, a.id);
      const lat      = latestSub(subs);
      const prev     = subs.length > 1 ? subs[subs.length - 2] : null;
      const t        = lat ? total(lat) : null;
      const st       = submissionStatus(subs, a);
      const sig      = getStudentSignal(s.id, a.id);
      const expanded = expandedInAssignment === s.id;

      const change = (t !== null && prev)
        ? total(lat) - total(prev)
        : null;
      const changeCell = change === null
        ? '<span class="no-signal">—</span>'
        : `<span style="color:${change > 0 ? 'var(--tau-positive)' : change < 0 ? 'var(--tau-attention)' : 'var(--tau-ink-faint)'}">${change > 0 ? '+' : ''}${change}</span>`;

      const dimCell = v => v !== null && v !== undefined ? v : '<span class="no-signal">—</span>';

      rows.push(`<tr class="row-clickable ${expanded ? 'expanded-row' : ''}" onclick="toggleAssignmentDrill('${s.id}')">
        <td>
          <div class="who">
            <div class="avatar avatar-sm">${s.initials}</div>
            <span style="font-weight:500">${s.name}</span>
          </div>
        </td>
        <td>${t !== null ? bandChip(t, true) : `<span class="chip ${st.cls}">${st.label}</span>`}</td>
        <td class="n">${t !== null ? t : '<span class="no-signal">—</span>'}</td>
        <td class="n">${changeCell}</td>
        <td class="n">${dimCell(lat?.pq)}</td>
        <td class="n">${dimCell(lat?.su)}</td>
        <td class="n">${dimCell(lat?.cs)}</td>
        <td class="n">${dimCell(lat?.oc)}</td>
        <td>${signalPill(sig) || '<span class="no-signal">—</span>'}</td>
      </tr>`);

      if (expanded) {
        rows.push(`<tr class="drill-row"><td colspan="9" style="padding:0">${renderDrillPanel(subs, s.name, sig, { studentId: s.id, assignmentId: a.id })}</td></tr>`);
      }
    });
  });

  const flagTotal = STUDENTS.filter(s => {
    const subs = getSubs(s.id, a.id);
    return checkFlag(subs).length > 0 || getIntegrityFlags(subs).length > 0;
  }).length;

  const metaParts = [`Due ${dueStr}`];
  if (flagTotal) metaParts.push(`<span class="signal-pill-review">Worth a chat</span>`);

  return `
    <div class="content-header">
      <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
        <div class="content-title">${a.name}</div>
        <span class="chip ${closed ? 'chip-grey' : 'chip-caution'}">${closed ? 'Closed' : 'Open'}</span>
      </div>
      <div class="content-meta">${metaParts.join(' · ')}</div>
    </div>
    <div class="tbl-wrap">
    <table class="roster">
      <thead><tr>
        ${sortTh('Student',      'name',        assignmentSort)}
        <th>How they're using AI</th>
        ${sortTh('Total',        'tau',         assignmentSort)}
        <th>Change</th>
        <th>PQ</th><th>SU</th><th>CS</th><th>OC</th>
        <th>Worth a chat</th>
      </tr></thead>
      <tbody>${rows.join('')}</tbody>
    </table>
    </div>
    <p style="margin-top:10px;font-size:12px;color:var(--tau-ink-soft)">Click a row to see submission history and details.</p>
  `;
}

function renderStudentOverview() {
  const allStudents = CLASSES.flatMap(cls =>
    cls.studentIds.map(sid => ({ student: STUDENTS.find(x => x.id === sid), cls }))
  ).filter(({ student }) => student);

  const review    = allStudents.filter(({ student }) => getStudentSignal(student.id).status === 'review');
  const onTrack   = allStudents.filter(({ student }) => getStudentSignal(student.id).status !== 'review');

  function card({ student, cls }) {
    const sig = getStudentSignal(student.id);
    const flaggedAssignments = ASSIGNMENTS.filter(a => {
      const subs = getSubs(student.id, a.id);
      return checkFlag(subs).length > 0 || getIntegrityFlags(subs).length > 0;
    });
    const latestSubs = ASSIGNMENTS.map(a => latestSub(getSubs(student.id, a.id))).filter(Boolean);
    const best = latestSubs.length ? latestSubs.reduce((a, b) => b.ts > a.ts ? b : a) : null;
    const t = best ? total(best) : null;

    return `<div class="overview-card" onclick="selectStudent('${student.id}')">
      <div style="display:flex;align-items:center;gap:10px">
        <div class="avatar" style="width:32px;height:32px;font-size:12px;flex-shrink:0">${student.initials}</div>
        <div style="flex:1;min-width:0">
          <div style="display:flex;align-items:center;gap:7px;flex-wrap:wrap">
            <span style="font-weight:600;font-size:13px">${student.name}</span>
            ${signalPill(sig)}
          </div>
          <div style="font-size:11px;color:var(--tau-ink-soft);margin-top:1px">${cls.name}</div>
        </div>
        ${t !== null ? `<div style="text-align:right;flex-shrink:0"><span style="font-weight:700;font-size:13px">${t}</span><span style="font-size:11px;font-weight:400;color:var(--tau-ink-soft)">/20</span><div style="margin-top:2px">${bandChip(t, true)}</div></div>` : ''}
      </div>
      ${sig.status === 'review' && flaggedAssignments.length ? `<div style="margin-top:7px;padding-top:7px;border-top:1px solid var(--tau-line);font-size:11px;color:var(--tau-ink-soft)"><span class="signal-pill-review">Worth a chat</span> — ${flaggedAssignments.map(a => a.name).join(', ')}</div>` : ''}
    </div>`;
  }

  function section(items, label, color) {
    if (!items.length) return '';
    return `<div>
      <div style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.8px;color:${color};margin-bottom:8px">${label} <span style="font-weight:400;color:var(--tau-ink-soft);text-transform:none;letter-spacing:0">${items.length}</span></div>
      <div style="display:flex;flex-direction:column;gap:6px">${items.map(card).join('')}</div>
    </div>`;
  }

  const sections = [
    section(review,   'Worth a chat', 'var(--tau-caution)'),
    section(onTrack,  'On track',     'var(--tau-ink-soft)'),
  ].filter(Boolean).join('<div style="height:20px"></div>');

  const metaParts = [];
  if (review.length) metaParts.push(`<span class="signal-pill-review">Worth a chat</span>`);
  if (!metaParts.length) metaParts.push('all on track');

  return `
    <div class="content-header">
      <div class="content-title">Students</div>
      <div class="content-meta">${allStudents.length} students · ${metaParts.join(' · ')}</div>
    </div>
    ${sections}
  `;
}

function renderStudentContent() {
  if (activeStudent === 'overview') return renderStudentOverview();
  const s = STUDENTS.find(x => x.id === activeStudent);
  if (!s) return renderStudentOverview();
  const cls = CLASSES.find(c => c.studentIds.includes(s.id));
  const sig = getStudentSignal(s.id);

  const sorted = [...ASSIGNMENTS].sort((a, b) => (a.status === b.status ? 0 : a.status === 'open' ? -1 : 1));
  let lastGroup = null;
  const sections = sorted.map(a => {
    const subs     = getSubs(s.id, a.id);
    const st       = submissionStatus(subs, a);
    const lat      = latestSub(subs);
    const t        = lat ? total(lat) : null;
    const expanded = expandedInStudent === a.id;

    let groupLabel = '';
    if (a.status !== lastGroup) {
      lastGroup = a.status;
      const isFirst = a.status === 'open';
      groupLabel = `<div class="sidebar-section" style="padding:0;margin-bottom:6px${isFirst ? '' : ';margin-top:16px'}">${a.status === 'open' ? 'Open' : 'Closed'}</div>`;
    }

    const asig = getStudentSignal(s.id, a.id);
    const drillPanel = expanded
      ? `<div class="assignment-drill">${renderDrillPanel(subs, a.name, asig, { studentId: s.id, assignmentId: a.id })}</div>`
      : '';

    return `${groupLabel}<div style="margin-bottom:${expanded ? 16 : 8}px">
      <div class="assignment-summary-row ${expanded ? 'expanded' : ''}" onclick="toggleStudentDrill('${a.id}')">
        <span class="chevron">${expanded ? '▾' : '▸'}</span>
        <span style="font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${a.name}</span>
        <span style="width:48px;text-align:right;flex-shrink:0;font-weight:700;font-size:13px">${t !== null ? `${t}<span style="font-size:11px;font-weight:400;color:var(--tau-ink-soft)">/20</span>` : '<span style="font-size:12px;color:var(--tau-ink-soft)">—</span>'}</span>
        <span style="width:150px;flex-shrink:0">${t !== null ? bandChip(t, true) : ''}</span>
        <span style="width:80px;text-align:center;flex-shrink:0">${signalPill(asig)}</span>
        <span style="width:88px;text-align:center;flex-shrink:0"><span class="chip ${st.cls}" style="font-size:10px">${st.label}</span></span>
        <span style="width:44px;text-align:right;flex-shrink:0;font-size:11px;color:var(--tau-ink-soft)">${subs.length} sub${subs.length !== 1 ? 's' : ''}</span>
      </div>
      ${drillPanel}
    </div>`;
  }).join('');

  return `
    <div class="content-header">
      <div style="display:flex;align-items:center;gap:12px">
        <div class="avatar" style="width:40px;height:40px;font-size:14px">${s.initials}</div>
        <div>
          <div style="display:flex;align-items:center;gap:8px">
            <div class="content-title">${s.name}</div>
            ${signalPill(sig)}
          </div>
          <div class="content-meta">${cls ? cls.name : ''}</div>
        </div>
      </div>
    </div>
    ${sections}
  `;
}

// ── Sort helpers ─────────────────────────────────────────────────────────────

function sortTh(label, col, state) {
  const active = state.col === col;
  const arrow  = active ? (state.dir === 'asc' ? '↑' : '↓') : '⇅';
  return `<th class="sortable${active ? ' sort-active' : ''}"
    onclick="toggleSort('${col}')"
  >${label}<em class="sort-arrow">${arrow}</em></th>`;
}

function toggleSort(col) {
  const isAssignment = activeTab === 'assignment' && activeAssignment !== 'overview';
  const isClass      = activeTab === 'class'      && activeClass      !== 'overview';
  if (isAssignment) {
    if (assignmentSort.col === col) assignmentSort.dir = assignmentSort.dir === 'asc' ? 'desc' : 'asc';
    else assignmentSort = { col, dir: col === 'name' ? 'asc' : 'desc' };
  } else if (isClass) {
    if (classSort.col === col) classSort.dir = classSort.dir === 'asc' ? 'desc' : 'asc';
    else classSort = { col, dir: col === 'name' ? 'asc' : 'desc' };
  }
  renderContent();
}

function sortStudents(students, assignment) {
  const { col, dir } = assignmentSort;
  if (!col) return students;
  const m = dir === 'asc' ? 1 : -1;
  return [...students].sort((a, b) => {
    if (col === 'name') return m * a.name.localeCompare(b.name);
    const subsA = getSubs(a.id, assignment.id), subsB = getSubs(b.id, assignment.id);
    const latA  = latestSub(subsA), latB = latestSub(subsB);
    if (col === 'tau') return m * ((latA ? total(latA) : -1) - (latB ? total(latB) : -1));
    return 0;
  });
}

function sortAssignments(assignments) {
  const { col, dir } = classSort;
  if (!col) return assignments;
  const m = dir === 'asc' ? 1 : -1;
  const cls = CLASSES.find(c => c.id === activeClass);
  const students = cls ? cls.studentIds.map(sid => STUDENTS.find(s => s.id === sid)).filter(Boolean) : [];
  return [...assignments].sort((a, b) => {
    if (col === 'name') return m * a.name.localeCompare(b.name);
    if (col === 'submitted') {
      const sa = students.filter(s => getSubs(s.id, a.id).length > 0).length;
      const sb = students.filter(s => getSubs(s.id, b.id).length > 0).length;
      return m * (sa - sb);
    }
    if (col === 'flags') {
      const fa = students.filter(s => { const subs = getSubs(s.id, a.id); return checkFlag(subs).length > 0 || getIntegrityFlags(subs).length > 0; }).length;
      const fb = students.filter(s => { const subs = getSubs(s.id, b.id); return checkFlag(subs).length > 0 || getIntegrityFlags(subs).length > 0; }).length;
      return m * (fa - fb);
    }
    return 0;
  });
}

function renderContent() {
  const el = document.getElementById('content');
  if      (activeTab === 'overview')   el.innerHTML = renderOverviewContent();
  else if (activeTab === 'class')      el.innerHTML = renderClassContent();
  else if (activeTab === 'assignment') el.innerHTML = renderAssignmentContent();
  else                                  el.innerHTML = renderStudentContent();
}

// ── Navigation ────────────────────────────────────────────────────────────────

function setTab(tab) {
  activeTab = tab;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  render();
}

function selectClass(cid)     { activeClass = cid; expandedInClass = null; classSort = { col: null, dir: 'asc' }; render(); }
function selectAssignment(aid){ activeAssignment = aid; expandedInAssignment = null; assignmentSort = { col: 'name', dir: 'asc' }; render(); }
function selectStudent(sid)   { activeStudent = sid; expandedInStudent = null; render(); }

function gotoAssignment(aid) {
  activeAssignment     = aid;
  expandedInAssignment = null;
  setTab('assignment');
}

function gotoClass(cid) {
  activeClass     = cid;
  expandedInClass = null;
  classSort       = { col: null, dir: 'asc' };
  setTab('class');
}

function gotoStudentFilter(filter) {
  studentFilter = filter;
  setTab('student');
}

function toggleAssignmentDrill(sid) {
  expandedInAssignment = expandedInAssignment === sid ? null : sid;
  renderContent();
}

function toggleClassDrill(aid) {
  expandedInClass = expandedInClass === aid ? null : aid;
  renderContent();
}

function toggleStudentDrill(aid) {
  expandedInStudent = expandedInStudent === aid ? null : aid;
  renderContent();
}

function gotoStudentFromClass(sid) {
  activeStudent = sid;
  setTab('student');
}

function filterStudents(q) {
  studentSearch = q.toLowerCase().trim();
  const listEl = document.getElementById('student-list');
  if (listEl) listEl.innerHTML = renderStudentList();
}

function setStudentFilter(f) {
  studentFilter = f;
  document.querySelectorAll('.filter-chip').forEach(btn => {
    btn.className = 'filter-chip' + (btn.dataset.filter === f ? ` active-${f}` : '');
  });
  const listEl = document.getElementById('student-list');
  if (listEl) listEl.innerHTML = renderStudentList();
}

function render() {
  const sidebar = document.getElementById('sidebar');
  if (activeTab === 'overview') {
    sidebar.style.display = 'none';
  } else {
    sidebar.style.display = '';
    renderSidebar();
  }
  renderContent();
}

// ── Flag tray ─────────────────────────────────────────────────────────────────

function openFlagTray(key, spikeCtx) {
  const meta = FLAG_META[key];
  if (!meta) return;

  let desc = meta.desc;
  if (key === 'score-spike' && spikeCtx) {
    desc = `Score jumped +${spikeCtx.scoreDiff} points in ${spikeCtx.mins} minute${spikeCtx.mins !== 1 ? 's' : ''}`;
  }

  document.getElementById('tray-title').textContent   = meta.short;
  document.getElementById('tray-subtitle').textContent = desc;
  document.getElementById('tray-body').innerHTML = `
    <div>
      <div class="tray-section-label">What this means</div>
      <div class="tray-section-body">${meta.what}</div>
    </div>
    <div>
      <div class="tray-section-label">Why we flagged it</div>
      <div class="tray-section-body">${meta.why}</div>
    </div>
    <div>
      <div class="tray-section-label">Potential next steps</div>
      <ul class="tray-steps">
        ${meta.steps.map((s, i) => `<li><span class="tray-step-num">${i + 1}</span><span>${s}</span></li>`).join('')}
      </ul>
    </div>
  `;

  document.getElementById('tray-overlay').classList.add('open');
  document.getElementById('side-tray').classList.add('open');
}

function closeFlagTray() {
  document.getElementById('tray-overlay').classList.remove('open');
  document.getElementById('side-tray').classList.remove('open');
}

// ── Flag detection modal ───────────────────────────────────────────────────────

const FLAG_TYPES = {
  'stylistic-inconsistency':   'integrity',
  'unnatural-fluency':         'integrity',
  'provenance-mismatch':       'integrity',
  'shadow-session-pattern':    'integrity',
  'score-spike':               'score',
  'reflection-score-mismatch': 'reflection',
  'reflection-delta-mismatch': 'reflection',
};

function openFlagModal() {
  const body = document.getElementById('flag-modal-body');
  body.innerHTML = Object.entries(FLAG_META).map(([key, f]) => {
    const type    = FLAG_TYPES[key] || 'integrity';
    const typeLabel = type === 'integrity'
      ? `<span class="flag-type-label chip-caution">Integrity</span>`
      : type === 'reflection'
        ? `<span class="flag-type-label chip-neutral">Reflection</span>`
        : `<span class="flag-type-label chip-neutral">Score analysis</span>`;
    const steps = f.steps?.length
      ? `<div class="flag-card-section">What to do</div>
         <ol class="flag-card-steps">${f.steps.map(s => `<li>${s}</li>`).join('')}</ol>`
      : '';
    return `<div class="flag-card">
      <div class="flag-card-header">
        <span class="flagdot"><i class="dot dot-caution"></i></span>
        <span class="flag-card-title">${f.short}</span>
        ${typeLabel}
      </div>
      <div class="flag-card-desc">${f.desc}</div>
      <div class="flag-card-section">What the tool detects</div>
      <div class="flag-card-body">${f.what}</div>
      <div class="flag-card-section">Why it matters</div>
      <div class="flag-card-body">${f.why}</div>
      ${steps}
    </div>`;
  }).join('');
  document.getElementById('flag-modal-overlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeFlagModal(e) {
  if (e && e.target !== document.getElementById('flag-modal-overlay')) return;
  document.getElementById('flag-modal-overlay').classList.remove('open');
  document.body.style.overflow = '';
}

// ── Tab nav ───────────────────────────────────────────────────────────────────

document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => setTab(btn.dataset.tab));
});

// ── Init ──────────────────────────────────────────────────────────────────────

api('/api/me').then((me) => { document.getElementById('whoami').textContent = me.displayName; }).catch(() => {});

loadDashboardData().then(render).catch((err) => {
  document.body.insertAdjacentHTML('afterbegin',
    `<div style="padding:20px;color:var(--tau-attention);font-family:var(--tau-font-ui)">Could not load dashboard data: ${err.message}</div>`);
});
</script>
</body>
</html>
