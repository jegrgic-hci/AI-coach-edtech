<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Choose your password — Tau Thinking</title>
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="components.css">
<link rel="stylesheet" href="style.css">
<script src="theme.js"></script>
</head>
<body class="login-body">

<button class="theme-toggle theme-toggle-floating" type="button" aria-pressed="false" aria-label="Switch to dark theme"><span class="theme-toggle-icon" aria-hidden="true">&#9790;</span></button>

<div class="login-shell">
  <section class="login-hero">
    <img class="login-hero-logo" src="assets/logo-mark.png" alt="Tau" width="391" height="192">
    <h1 class="login-hero-title">Develop your thinking.</h1>
    <p class="login-hero-tagline">AI should redefine how you think — not substitute it.</p>
    <p class="login-hero-sub">See how each student actually worked with AI — not just the essay they turned in.</p>
  </section>

  <section class="login-panel">
    <main class="card card-lg login-card">
      <h1>Choose your password</h1>
      <!-- Height reserved rather than grown into: the account line arrives a
           moment after paint, and a form that jumps under the cursor is the
           same layout-shift bug the login logo had. -->
      <p class="login-sub auth-identity" id="identity">&nbsp;</p>

      <form id="setPasswordForm" class="auth-form" novalidate>
        <!-- Stated before the field, not after a rejected submit: discovering a
             required constraint by violating it is the same mistake as hiding
             a required field. -->
        <p class="auth-rule">At least 12 characters. A long phrase you will remember beats a short one with symbols in it.</p>

        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="new-password" required minlength="12">

        <label for="confirm">Confirm password</label>
        <input id="confirm" name="confirm" type="password" autocomplete="new-password" required>

        <!-- The consent itself stays on the form, visible, never behind the
             dialog: it is a required decision, and only the document it refers
             to is long enough to be worth deferring (product-design-review,
             required-vs-hidden). Hidden until the account type is known, so a
             reset never shows a box it will not use. -->
        <div class="field-check terms-check hidden" id="termsField">
          <input type="checkbox" id="termsAgree">
          <!-- Both the document's name and the line under it come from the
               server with the version, because which document this account
               agrees to is the server's decision: a teacher sees "Pilot
               Agreement", a student "Terms of Use". Empty here rather than
               defaulted to either — a wrong name on a consent is worse than a
               late one. -->
          <label for="termsAgree">I have read and agree to the <button type="button" class="link-btn" id="termsOpen"></button>
            <span class="field-help" id="termsBlurb"></span>
          </label>
        </div>

        <p class="login-error hidden" id="formError" role="alert"></p>
        <button type="submit" class="login-submit" id="submitBtn">Set password and sign in</button>
      </form>
    </main>
  </section>
</div>

<!-- Reading surface only — agreeing happens on the form behind it. Native
     <dialog> so focus trapping, Escape and the backdrop are the browser's job
     rather than four more listeners; this page loads none of dashboard.html's
     modal machinery. -->
<dialog class="doc-dialog" id="termsDialog" aria-labelledby="termsTitle">
  <header class="doc-dialog-head">
    <h2 id="termsTitle">Terms of Use</h2>
    <button type="button" class="doc-dialog-close" id="termsClose" aria-label="Close">&times;</button>
  </header>
  <div class="doc-dialog-body doc-prose" id="termsBody" tabindex="0"></div>
  <footer class="doc-dialog-foot">
    <p class="doc-dialog-version" id="termsVersion"></p>
    <button type="button" class="login-submit doc-dialog-done" id="termsDone">Close</button>
  </footer>
</dialog>

<script src="api.js"></script>
<script src="set-password.js"></script>
</body>
</html>
