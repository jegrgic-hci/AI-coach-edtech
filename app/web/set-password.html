<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Choose your password — Tau Thinking</title>
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="components.css">
<link rel="stylesheet" href="style.css">
<script src="theme.js"></script>
</head>
<body class="login-body">

<button class="theme-toggle theme-toggle-floating" type="button" aria-pressed="false" aria-label="Switch to dark theme"><span class="theme-toggle-icon" aria-hidden="true">&#9790;</span></button>

<div class="login-shell">
  <section class="login-hero">
    <img class="login-hero-logo" src="assets/logo-mark.png" alt="Tau" width="391" height="192">
    <h1 class="login-hero-title">Develop your thinking.</h1>
    <p class="login-hero-tagline">AI should redefine how you think — not substitute it.</p>
    <p class="login-hero-sub">See how each student actually worked with AI — not just the essay they turned in.</p>
  </section>

  <section class="login-panel">
    <main class="card card-lg login-card">
      <h1>Choose your password</h1>
      <!-- Height reserved rather than grown into: the account line arrives a
           moment after paint, and a form that jumps under the cursor is the
           same layout-shift bug the login logo had. -->
      <p class="login-sub auth-identity" id="identity">&nbsp;</p>

      <form id="setPasswordForm" class="auth-form" novalidate>
        <!-- Stated before the field, not after a rejected submit: discovering a
             required constraint by violating it is the same mistake as hiding
             a required field. -->
        <p class="auth-rule">At least 12 characters. A long phrase you will remember beats a short one with symbols in it.</p>

        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="new-password" required minlength="12">

        <label for="confirm">Confirm password</label>
        <input id="confirm" name="confirm" type="password" autocomplete="new-password" required>

        <p class="login-error hidden" id="formError" role="alert"></p>
        <button type="submit" class="login-submit" id="submitBtn">Set password and sign in</button>
      </form>
    </main>
  </section>
</div>

<script src="api.js"></script>
<script src="set-password.js"></script>
</body>
</html>
