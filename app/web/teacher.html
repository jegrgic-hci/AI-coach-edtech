<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Assignments — Tau Thinking</title>
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="components.css">
<link rel="stylesheet" href="style.css">
<script src="theme.js"></script>
<style>
/* Same layout as dashboard.html's bare header element — teacher.html has no
   equivalent selector of its own, so .app-header was rendering unstyled
   before this rule existed. */
.app-header {
  background: var(--tau-surface);
  border-bottom: 1px solid var(--tau-line);
  padding: 13px var(--tau-s6);
  display: flex;
  align-items: center;
  gap: var(--tau-s3);
  flex-shrink: 0;
}
.app-header h1 { font-size: var(--tau-text-lg); font-weight: 700; letter-spacing: -0.2px; }

.teacher-main { padding: 28px 32px; max-width: 1000px; margin: 0 auto; width: 100%; overflow-y: auto; }

/* Chrome (background/border/radius/padding) comes from components.css's
   .card-lg now — this only adds the stacking margin between panels. */
.panel-card { margin-bottom: 16px; }
.panel-card h3 { margin-bottom: 10px; }

/* .new-assignment-form/.form-row/.level-selects/.draft-slot-row* moved to
   components.css — dashboard.html's new-assignment modal reuses them now. */

/* Row chrome comes from components.css's .list-row/.list-row-name now — this
   only adds the separator rule between rows, the name's fixed width, and the
   hover-forest nuance this roster wants, none of which the shared component
   opinions on. */
.roster-row { border-top: 1px solid var(--tau-line); }
.list-row:hover .list-row-name { color: var(--tau-forest); }
.list-row-name { min-width: 140px; }
/* Plain text, not a chip — added 2026-07-29. A completed, unflagged draft
   cycle is the common case in this row, not the exception, and it isn't
   actionable; enclosing it the same as the (rare, actionable) flagged cycle
   meant every roster row showed 2-3 equally salient pills with only one of
   them worth a look. See designsystem.md's salience-budget rule: enclosure
   is reserved for values that are both actionable and rare. Only the
   flagged branch (teacher.js) still gets real chip chrome. */
.cycle-label { font-size: var(--tau-text-xs); font-weight: 600; color: var(--tau-forest); }
.cycle-label-pending { color: var(--tau-ink-soft); font-weight: 400; }
.active-note { font-size: 12px; color: var(--tau-positive); }

/* student detail */
.traj-strip { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 4px; }
/* Chrome comes from components.css's .card now — this keeps only the flex
   sizing three cards need to sit side by side. */
.traj-card { flex: 1; min-width: 150px; }
.traj-card .lvl { font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--tau-ink-soft); }
.traj-card .samr { font-weight: 700; margin: 4px 0; }
/* Not .dim-grid — that is the four-dimension quadrant grid in components.css.
   This is the one-line triage summary, which is a different object at a
   different density. */
.traj-card .dim-line { font-size: 12px; color: var(--tau-ink-soft); }
.traj-card a { font-size: 12px; }

/* Shaped closer to a callout than a card (no background/full border/radius —
   just a ruled left edge over running text), so it stays its own pattern
   rather than being forced onto .card or .quote. */
.moment { border-left: 3px solid var(--tau-forest); padding: 6px 14px; margin-bottom: 10px; }
.moment .m-kind { font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--tau-forest); }
.moment .m-quote { font-style: italic; margin: 3px 0; }
.moment .m-why { font-size: 12px; color: var(--tau-ink-soft); }
.moment.warn { border-color: var(--tau-caution); } .moment.warn .m-kind { color: var(--tau-caution); }

.transcript { border: 1px solid var(--tau-line); border-radius: 10px; padding: 14px; margin-top: 10px; }
.transcript summary { cursor: pointer; font-weight: 600; font-size: 14px; }
/* The transcript itself is components.css's .turn/.msg/.turn-student/
   .turn-coach/.turn-auditor/.msg-superseded now — see teacher.js. */
.t-event { font-size: 12px; color: var(--tau-caution); background: var(--tau-caution-bg); border-radius: 6px; padding: 3px 10px; margin: 6px 0; display: inline-block; }
.note-saved { font-size: 12px; color: var(--tau-positive); margin-left: 8px; }
/* Layout tweak only — text/colour/weight come from components.css's
   .eyebrow now (was its own near-identical uppercase micro-label). */
.eyebrow { margin: 14px 0 8px; }
</style>
</head>
<body>

<div id="viewOverview" class="view">
  <header class="app-header">
    <span class="tau-nav-mark"><img class="tau-nav-logo" src="assets/logo-mark.png" alt="Tau">Thinking</span>
    <h1>Assignments</h1>
    <span class="chip chip-neutral">Teacher</span>
    <span class="visibility-cue">Signals are conversation-starters, never verdicts</span>
    <div class="account-chip" id="accountChip"></div>
    <button class="theme-toggle" type="button" aria-pressed="false" aria-label="Switch to dark theme"><span class="theme-toggle-icon" aria-hidden="true">&#9790;</span></button>
  </header>
  <main class="teacher-main" id="overviewBody"></main>
</div>

<div id="viewStudent" class="view hidden">
  <header class="app-header">
    <button class="btn btn-quiet btn-sm" id="btnBackOverview">&larr; All assignments</button>
    <h1 id="studentTitle"></h1>
    <span class="chip chip-neutral">Teacher</span>
    <button class="theme-toggle theme-toggle-end" type="button" aria-pressed="false" aria-label="Switch to dark theme"><span class="theme-toggle-icon" aria-hidden="true">&#9790;</span></button>
  </header>
  <main class="teacher-main" id="studentBody"></main>
</div>

<script src="api.js"></script>
<script src="teacher.js"></script>
</body>
</html>
