<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" role="img" aria-label="Tau">
  <!-- The leaf from the TAU wordmark. Not a crop: in the logo art the leaf's
       right edge IS the A's diagonal, so no raster slice comes away clean.
       Instead the leaf's boundary was traced out of logo-brand-transparent.png
       by colour (sage is an exact flat fill there, so the edges are unambiguous)
       and cubics were least-squares fitted to the traced pixels. Only the base
       spur at lower-left is drawn rather than measured — the A's left stroke
       covers the leaf there, so the logo never shows where it ends.
       Filled, not stroked: this is the brand mark, not a member of the outlined
       set in icons.js. Sage (#3D7A5A, the tau-sage token) is the logo's own
       leaf colour, sampled from the art; it is hardcoded because currentColor
       is inert when the file is used as an img src. -->
  <path fill="#3D7A5A" d="M1 19.36C1.79 14.29 3.22 11.45 4.64 10.18 6.28 8.85 8.11 7.95 10.18 7.65 12.5 7.08 14.44 7.23 16.51 6.7 19.18 6.59 21.43 4.95 22.68 4.64 22.24 6.67 21.46 10.8 19.68 13.35 17.68 16.44 15.63 17.67 13.03 18.73 10.24 19.77 7.52 19.83 4.64 19.52 5.96 16.31 7.54 14.8 9.23 13.82 11.47 12.37 12.26 11.98 14.93 11.05 12.25 11.15 11.51 11.56 9.23 12.4 7.57 12.98 6.07 13.95 4.64 15.09 3.22 17.14 1.95 18.57 1 19.36Z"/>
</svg>
