# Push-to-deploy for the app/ service. Fires from a Cloud Build trigger on the
# GitHub repo; see app/README.md's Deployment section for the manual equivalent.
#
# Images are tagged with $COMMIT_SHA, so every Cloud Run revision maps back to
# exactly one commit. That is the property the old `--source .` deploys did not
# have: they uploaded the working directory, so a live revision could
# correspond to no commit at all.
#
# This deploys to `tau-thinking-prod` — the real-users project, separate from
# `cta-pilot-dev` since 2026-08-08. The build still *executes* in cta-pilot-dev,
# because that is where the trigger's GitHub App connection lives; the image and
# the service both land in prod. Moving the connection to prod needs a browser
# OAuth step and is the one loose end here (app/README.md, Deployment).
#
# There is deliberately no demo data path in this file: the seed is opt-in via
# SEED_DEMO, which is never set here. See app/server/seed.js. The staging
# instance, which does seed demo data, is cloudbuild.staging.yaml — keep the
# two in step when this service's env vars or flags change.

steps:
  - id: build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_IMAGE}:$COMMIT_SHA
      - -t
      - ${_IMAGE}:latest
      - .

  - id: push
    name: gcr.io/cloud-builders/docker
    args: [push, --all-tags, '${_IMAGE}']

  # Env vars are repeated in full because --set-env-vars replaces the whole set
  # rather than merging. Dropping one here silently unconfigures the service.
  #
  # The ^;^ prefix switches gcloud's separator from comma to semicolon. MAIL_FROM
  # is a display name plus an address, and the day someone writes "Tau Thinking,
  # Inc." a comma-separated list would split mid-value and set two broken vars
  # instead of failing.
  #
  # No --allow-unauthenticated / --no-allow-unauthenticated: the service's IAM
  # policy (allUsers → run.invoker, deliberate, see app/README.md) is managed
  # separately and must not be churned by an ordinary deploy.
  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - cta
      - --image=${_IMAGE}:$COMMIT_SHA
      - --region=us-central1
      - --project=tau-thinking-prod
      - --service-account=cta-run@tau-thinking-prod.iam.gserviceaccount.com
      - --set-env-vars=^;^NODE_ENV=production;GCP_PROJECT_ID=tau-thinking-prod;GCP_LOCATION=global;MAIL_FROM=Tau Thinking <no-reply@tauthinking.com>;APP_URL=https://app.tauthinking.com
      # The mail credentials are the first values here that must not be in this
      # file — it is committed. Secret Manager holds them; --set-secrets is a
      # separate set from --set-env-vars and is likewise replaced wholesale, so
      # both lines have to stay complete.
      #
      # Without these, production starts fine and then refuses to send on the
      # first invite (mail.js declines to run key-less in production rather
      # than printing invite links into a log).
      - --set-secrets=SMTP2GO_API_KEY=smtp2go-api-key:latest,MAIL_WEBHOOK_SECRET=mail-webhook-secret:latest
      - --max-instances=20

substitutions:
  _IMAGE: us-central1-docker.pkg.dev/tau-thinking-prod/cta/cta

images:
  - '${_IMAGE}:$COMMIT_SHA'
  - '${_IMAGE}:latest'

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8
