<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Teacher Dashboard — Critical Thinking Auditor</title>
<style>
:root {
  --blue: #3B3EA8;
  --blue-mid: #6B7DD4;
  --blue-light: #9B9DE0;
  --blue-tint: #f0f1f8;
  --terra: #b85c38;
  --terra-light: #e8ae94;
  --terra-tint: #fdf3ee;
  --bg: #f7f7f5;
  --surface: #ffffff;
  --border: #e5e5e2;
  --text: #1a1a1a;
  --text-mid: #555;
  --text-muted: #999;
  --green: #2d7a4f;
  --green-tint: #edf7f1;
  --amber: #b07030;
  --amber-tint: #fdf6ec;
  --grey-tint: #f2f2f0;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }

body {
  font-family: "Helvetica Neue", Arial, sans-serif;
  background: var(--bg);
  color: var(--text);
  font-size: 14px;
  line-height: 1.5;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* ── Header ── */
header {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 13px 24px;
  display: flex;
  align-items: center;
  gap: 10px;
  flex-shrink: 0;
}
header h1 { font-size: 15px; font-weight: 700; letter-spacing: -0.2px; }
header .subtitle { font-size: 12px; color: var(--text-muted); }
.back-link {
  margin-left: auto;
  font-size: 12px; font-weight: 600;
  color: var(--blue);
  background: var(--blue-tint);
  border: 1px solid #c5c7e8;
  padding: 5px 12px;
  border-radius: 20px;
  text-decoration: none;
  white-space: nowrap;
}
.back-link:hover { background: #e3e4f4; }

/* ── Global tab nav ── */
.tab-nav {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 0 24px;
  display: flex;
  flex-shrink: 0;
}
.tab-btn {
  background: none;
  border: none;
  border-bottom: 2px solid transparent;
  padding: 10px 16px;
  font-size: 13px; font-weight: 500;
  color: var(--text-muted);
  cursor: pointer;
  transition: color 0.15s, border-color 0.15s;
}
.tab-btn:hover { color: var(--text); }
.tab-btn.active { color: var(--blue); border-bottom-color: var(--blue); }

/* ── Layout ── */
.layout {
  display: flex;
  flex: 1;
  overflow: hidden;
}

/* ── Sidebar ── */
.sidebar {
  width: 220px;
  flex-shrink: 0;
  background: var(--surface);
  border-right: 1px solid var(--border);
  overflow-y: auto;
  display: flex;
  flex-direction: column;
}
.sidebar-section {
  font-size: 10px; font-weight: 700;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.8px;
  padding: 14px 16px 5px;
  flex-shrink: 0;
}
.sidebar-item {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 9px 16px;
  cursor: pointer;
  border-left: 2px solid transparent;
  transition: background 0.1s;
  flex-shrink: 0;
}
.sidebar-item:hover { background: var(--grey-tint); }
.sidebar-item.active { background: var(--blue-tint); border-left-color: var(--blue); }
.sidebar-item-name {
  font-size: 13px; font-weight: 500;
  color: var(--text);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.sidebar-item.active .sidebar-item-name { color: var(--blue); font-weight: 600; }
.sidebar-item-sub {
  font-size: 11px;
  color: var(--text-muted);
  margin-top: 1px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.flag-dot {
  font-size: 11px;
  color: var(--terra);
  flex-shrink: 0;
  line-height: 1;
}
.sidebar-search {
  padding: 12px 12px 6px;
  flex-shrink: 0;
}
.sidebar-search input {
  width: 100%;
  padding: 6px 10px;
  border: 1px solid var(--border);
  border-radius: 4px;
  font-size: 12px;
  background: var(--bg);
  color: var(--text);
  outline: none;
  font-family: inherit;
}
.sidebar-search input:focus { border-color: var(--blue-light); }

/* ── Content ── */
.content {
  flex: 1;
  overflow-y: auto;
  padding: 28px 32px;
  background: var(--bg);
}
.content-header {
  margin-bottom: 22px;
  padding-bottom: 16px;
  border-bottom: 1px solid var(--border);
}
.content-title {
  font-size: 18px; font-weight: 700;
  letter-spacing: -0.3px;
  color: var(--text);
}
.content-meta {
  font-size: 12px;
  color: var(--text-muted);
  margin-top: 4px;
}

/* ── Chips & badges ── */
.chip {
  display: inline-block;
  font-size: 11px; font-weight: 600;
  padding: 2px 8px;
  border-radius: 20px;
  letter-spacing: 0.3px;
}
.chip-blue  { background: var(--blue-tint); color: var(--blue); }
.chip-terra { background: var(--terra-tint); color: var(--terra); }
.chip-grey  { background: var(--grey-tint); color: var(--text-mid); border: 1px solid var(--border); }
.chip-green { background: var(--green-tint); color: var(--green); }
.chip-amber { background: var(--amber-tint); color: var(--amber); }

.samr-badge {
  display: inline-block;
  font-size: 11px; font-weight: 600;
  padding: 2px 8px;
  border-radius: 3px;
}
.samr-redef { background: var(--blue);       color: #fff; }
.samr-mod   { background: var(--blue-mid);   color: #fff; }
.samr-aug   { background: var(--blue-light); color: #fff; }
.samr-sub   { background: #ccc; color: #555; }

.flag-badge {
  display: inline-flex;
  align-items: center;
  gap: 3px;
  font-size: 11px;
  color: var(--terra);
  flex-shrink: 0;
}

.status-final       { background: var(--green-tint); color: var(--green); }
.status-draft       { background: var(--amber-tint); color: var(--amber); }
.status-not-started { background: var(--grey-tint);  color: var(--text-muted); border: 1px solid var(--border); }
.status-missing     { background: var(--terra-tint); color: var(--terra); }

/* ── Avatar ── */
.avatar {
  width: 32px; height: 32px;
  border-radius: 50%;
  background: var(--blue-tint);
  color: var(--blue);
  font-size: 12px; font-weight: 700;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}

/* ── Data table ── */
.data-table {
  width: 100%;
  border-collapse: collapse;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  overflow: hidden;
  table-layout: fixed;
}
.data-table th {
  text-align: left;
  font-size: 11px; font-weight: 600;
  color: var(--text-muted);
  text-transform: uppercase; letter-spacing: 0.5px;
  padding: 10px 12px;
  background: var(--grey-tint);
  border-bottom: 1px solid var(--border);
}
.data-table th.sortable { cursor: pointer; user-select: none; white-space: nowrap; }
.data-table th.sortable:hover { color: var(--text); }
.data-table th.sortable .sort-arrow { font-size: 10px; margin-left: 3px; opacity: 0.35; font-style: normal; }
.data-table th.sort-active { color: var(--blue); }
.data-table th.sort-active .sort-arrow { opacity: 1; color: var(--blue); }
.data-table td {
  padding: 11px 12px;
  border-bottom: 1px solid var(--border);
  vertical-align: middle;
  overflow: hidden;
  text-align: left;
}
.data-table tr:last-child td { border-bottom: none; }
.data-table tbody tr { cursor: pointer; transition: background 0.1s; }
.data-table tbody tr:hover { background: var(--grey-tint); }
.data-table tbody tr.expanded-row { background: var(--blue-tint); }
.data-table tbody tr.drill-row { cursor: default; }
.data-table tbody tr.drill-row:hover { background: transparent; }

/* ── Drill panel ── */
.drill-panel {
  background: var(--blue-tint);
  border-top: 1px solid var(--blue-light);
  padding: 16px 20px;
}
.drill-panel-header {
  font-size: 11px; font-weight: 600;
  color: var(--blue);
  text-transform: uppercase; letter-spacing: 0.5px;
  margin-bottom: 12px;
}
.assignment-summary-row {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 14px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 6px;
  cursor: pointer;
  user-select: none;
  font-size: 13px;
}
.assignment-summary-row:hover { background: var(--blue-tint); border-color: var(--blue-light); }
.assignment-summary-row.expanded { background: var(--blue-tint); border-color: var(--blue-light); border-bottom-left-radius: 0; border-bottom-right-radius: 0; }
.assignment-summary-row .chevron { font-size: 11px; color: var(--text-muted); width: 14px; flex-shrink: 0; }
.assignment-drill { border: 1px solid var(--blue-light); border-top: none; border-bottom-left-radius: 6px; border-bottom-right-radius: 6px; }
.sub-history { display: flex; flex-direction: column; gap: 4px; }
.sub-row {
  display: flex; flex-direction: column;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 10px 14px;
  font-size: 12px;
}
.sub-row.flagged { border-color: var(--terra); background: var(--terra-tint); }
.sub-row-main { display: flex; align-items: center; gap: 10px; }
.sub-num  { font-size: 11px; font-weight: 600; color: var(--text-muted); width: 20px; flex-shrink: 0; }
.sub-date { color: var(--text-mid); width: 140px; flex-shrink: 0; font-size: 11px; }
.sub-chip { width: 44px; text-align: center; flex-shrink: 0; }
.sub-total { font-size: 14px; font-weight: 700; width: 40px; text-align: right; flex-shrink: 0; }
.integrity-flags-row {
  display: flex; align-items: baseline; gap: 6px; flex-wrap: wrap;
  margin-top: 7px; padding-top: 7px;
  border-top: 1px solid rgba(184, 92, 56, 0.15);
}

/* ── Dim scores ── */
.dim-scores { display: flex; gap: 5px; }
.dim-score {
  font-size: 11px; color: var(--text-muted);
  background: var(--grey-tint);
  padding: 2px 5px; border-radius: 3px;
}
.dim-score span { font-weight: 700; color: var(--text); }

.tau-total { font-size: 15px; font-weight: 700; }
.tau-denom { font-size: 12px; color: var(--text-muted); font-weight: 400; }

.overview-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 12px 14px;
  cursor: pointer;
  transition: background 0.1s, border-color 0.1s;
}
.overview-card:hover { background: var(--blue-tint); border-color: var(--blue-light); }
.sparkline { display: block; }

/* ── Flag lines ── */
.flag-line {
  display: flex;
  align-items: baseline;
  gap: 8px;
  font-size: 11px;
  color: var(--terra);
}
.flag-learn-more {
  font-size: 10px;
  font-weight: 600;
  color: var(--blue);
  text-decoration: none;
  white-space: nowrap;
  cursor: pointer;
  flex-shrink: 0;
}
.flag-learn-more:hover { text-decoration: underline; }

/* ── Side tray ── */
.tray-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.18);
  z-index: 100;
}
.tray-overlay.open { display: block; }

.side-tray {
  position: fixed;
  top: 0; right: 0;
  width: 400px;
  height: 100%;
  background: var(--surface);
  border-left: 1px solid var(--border);
  box-shadow: -4px 0 24px rgba(0,0,0,0.10);
  z-index: 101;
  display: flex;
  flex-direction: column;
  transform: translateX(100%);
  transition: transform 0.22s ease;
  overflow: hidden;
}
.side-tray.open { transform: translateX(0); }

.tray-header {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  padding: 20px 20px 16px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.tray-flag-icon {
  font-size: 16px;
  color: var(--terra);
  margin-top: 2px;
  flex-shrink: 0;
}
.tray-title {
  font-size: 15px;
  font-weight: 700;
  color: var(--text);
  letter-spacing: -0.2px;
  flex: 1;
}
.tray-subtitle {
  font-size: 12px;
  color: var(--text-muted);
  margin-top: 3px;
}
.tray-close {
  background: none;
  border: none;
  font-size: 18px;
  color: var(--text-muted);
  cursor: pointer;
  padding: 2px 6px;
  border-radius: 4px;
  line-height: 1;
  flex-shrink: 0;
}
.tray-close:hover { background: var(--grey-tint); color: var(--text); }

.tray-body {
  flex: 1;
  overflow-y: auto;
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 20px;
}
.tray-section-label {
  font-size: 10px;
  font-weight: 700;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.8px;
  margin-bottom: 6px;
}
.tray-section-body {
  font-size: 13px;
  color: var(--text);
  line-height: 1.6;
}
.tray-steps {
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin-top: 0;
  padding: 0;
  list-style: none;
}
.tray-steps li {
  display: flex;
  gap: 10px;
  font-size: 13px;
  color: var(--text);
  line-height: 1.5;
}
.tray-step-num {
  font-size: 11px;
  font-weight: 700;
  color: var(--blue);
  background: var(--blue-tint);
  width: 20px;
  height: 20px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  margin-top: 1px;
}

/* ── Class drill student rows ── */
.class-student-row {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 9px 12px;
  border-radius: 5px;
  cursor: pointer;
  transition: background 0.1s;
}
.class-student-row:hover { background: rgba(255,255,255,0.7); }
.class-student-row.missing { background: var(--terra-tint); }
.class-student-row.missing:hover { background: #f5ddd4; }

/* ── Signal indicators ── */
.signal-pill-review {
  font-size: 11px;
  color: var(--terra);
  white-space: nowrap;
  flex-shrink: 0;
  line-height: 1;
}
.signal-pill-attention {
  font-size: 10px; font-weight: 700;
  color: var(--blue-mid);
  white-space: nowrap;
  flex-shrink: 0;
  line-height: 1;
}
.signal-reason {
  font-size: 11px;
  color: var(--text-muted);
  margin-top: 2px;
  line-height: 1.3;
  white-space: normal;
}

/* ── Filter chips ── */
.filter-chips {
  display: flex;
  gap: 5px;
  padding: 6px 12px 2px;
  flex-shrink: 0;
  flex-wrap: wrap;
}
.filter-chip {
  font-size: 11px; font-weight: 600;
  padding: 3px 9px;
  border-radius: 20px;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text-muted);
  cursor: pointer;
  transition: all 0.1s;
  font-family: inherit;
}
.filter-chip:hover { color: var(--text); border-color: #bbb; }
.filter-chip.active-all      { background: var(--blue-tint);  border-color: var(--blue-light);  color: var(--blue); }
.filter-chip.active-review   { background: var(--terra-tint); border-color: var(--terra-light); color: var(--terra); }
.filter-chip.active-attention { background: var(--blue-tint);  border-color: var(--blue-light); color: var(--blue); }

/* ── Bar legend ── */
.bar-legend {
  display: flex;
  align-items: center;
  gap: 14px;
  margin-top: 12px;
  font-size: 11px;
  color: var(--text-muted);
  flex-wrap: wrap;
}
.legend-swatch {
  display: inline-block;
  width: 10px; height: 10px;
  border-radius: 2px;
  margin-right: 3px;
  vertical-align: middle;
}
/* ── Flag detection modal ── */
.modal-overlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.35);
  z-index: 200;
  display: flex; align-items: center; justify-content: center;
  opacity: 0; pointer-events: none;
  transition: opacity 0.18s ease;
}
.modal-overlay.open { opacity: 1; pointer-events: all; }
.modal {
  background: var(--surface);
  border-radius: 10px;
  box-shadow: 0 8px 40px rgba(0,0,0,0.18);
  width: min(680px, 92vw);
  max-height: 82vh;
  display: flex; flex-direction: column;
  overflow: hidden;
}
.modal-header {
  display: flex; align-items: flex-start; gap: 12px;
  padding: 20px 22px 16px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.modal-title { font-size: 15px; font-weight: 700; letter-spacing: -0.2px; flex: 1; }
.modal-intro { font-size: 12px; color: var(--text-muted); margin-top: 3px; line-height: 1.5; }
.modal-close {
  background: none; border: none; font-size: 18px;
  color: var(--text-muted); cursor: pointer;
  padding: 2px 6px; border-radius: 4px; line-height: 1; flex-shrink: 0;
}
.modal-close:hover { background: var(--grey-tint); color: var(--text); }
.modal-body {
  flex: 1; overflow-y: auto;
  padding: 20px 22px;
  display: flex; flex-direction: column; gap: 0;
}
.flag-card {
  padding: 16px 0;
  border-bottom: 1px solid var(--border);
}
.flag-card:last-child { border-bottom: none; }
.flag-card-header { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
.flag-card-title { font-size: 13px; font-weight: 700; }
.flag-card-desc { font-size: 12px; color: var(--text-mid); }
.flag-card-section { font-size: 10px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.7px; margin: 10px 0 4px; }
.flag-card-body { font-size: 12px; color: var(--text-mid); line-height: 1.55; }
.flag-card-steps { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 3px; }
.flag-card-steps li { font-size: 12px; color: var(--text-mid); line-height: 1.5; }
.flag-type-label {
  font-size: 10px; font-weight: 700;
  text-transform: uppercase; letter-spacing: 0.7px;
  padding: 2px 7px; border-radius: 20px;
  flex-shrink: 0;
}
.flag-type-integrity { background: var(--terra-tint); color: var(--terra); }
.flag-type-score    { background: var(--amber-tint); color: var(--amber); }
</style>
</head>
<body>

<header>
  <h1>Critical Thinking Auditor</h1>
  <span class="subtitle">Teacher Dashboard</span>
  <button onclick="openFlagModal()" style="margin-left:auto;font-size:12px;font-weight:600;color:var(--terra);background:var(--terra-tint);border:1px solid rgba(184,92,56,0.25);padding:5px 13px;border-radius:20px;cursor:pointer">⚑ Flag detection</button>
  <a href="index.html" class="back-link" style="margin-left:0">← Student Tool</a>
</header>

<nav class="tab-nav">
  <button class="tab-btn active" data-tab="overview">Overview</button>
  <button class="tab-btn"        data-tab="class">Class</button>
  <button class="tab-btn" data-tab="assignment">Assignment</button>
  <button class="tab-btn" data-tab="student">Student</button>
</nav>

<div class="layout">
  <aside id="sidebar" class="sidebar"></aside>
  <main id="content" class="content"></main>
</div>

<div class="modal-overlay" id="flag-modal-overlay" onclick="closeFlagModal(event)">
  <div class="modal" onclick="event.stopPropagation()">
    <div class="modal-header">
      <div style="flex:1;min-width:0">
        <div class="modal-title">Flag detection</div>
        <div class="modal-intro">The tool automatically checks every submission for these signals. Flags are never shown to students — they appear only in the teacher dashboard to support your review.</div>
      </div>
      <button class="modal-close" onclick="closeFlagModal()">✕</button>
    </div>
    <div class="modal-body" id="flag-modal-body"></div>
  </div>
</div>

<div class="tray-overlay" id="tray-overlay" onclick="closeFlagTray()"></div>
<div class="side-tray" id="side-tray">
  <div class="tray-header">
    <span class="tray-flag-icon">⚑</span>
    <div style="flex:1">
      <div class="tray-title" id="tray-title"></div>
      <div class="tray-subtitle" id="tray-subtitle"></div>
    </div>
    <button class="tray-close" onclick="closeFlagTray()">✕</button>
  </div>
  <div class="tray-body" id="tray-body"></div>
</div>

<script>
// ── Data ──────────────────────────────────────────────────────────────────────

const ASSIGNMENTS = [
  { id: 'a1', name: 'AI Ethics Essay',         due: new Date('2026-05-10'), status: 'closed' },
  { id: 'a2', name: 'Climate Change Analysis', due: new Date('2026-05-17'), status: 'closed' },
  { id: 'a3', name: 'Tech Impact Report',      due: new Date('2026-06-05'), status: 'open'   },
];

// ── Mock data generator (seeded, deterministic) ───────────────────────────────
function generateMockData(seed = 42) {
  let s = seed >>> 0;
  function rng() {
    s = Math.imul(1664525, s) + 1013904223 >>> 0;
    return s / 0x100000000;
  }
  function ri(lo, hi) { return Math.floor(rng() * (hi - lo + 1)) + lo; }
  function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
  function shuffle(arr) {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(rng() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  const FIRST = [
    'Maya','Jordan','Alex','Sam','Taylor','Morgan','Riley','Casey','Avery','Quinn',
    'Skyler','Drew','Jamie','Blake','Cameron','Reese','Sage','River','Emery','Finley',
    'Harper','Logan','Parker','Rowan','Sawyer','Kai','Luca','Nico','Remi','Sasha',
    'Ari','Brynn','Elliot','Hayden','Jaden','Keegan','Lennon','Marley','Noa','Piper',
    'Rory','Scout','Sloane','Spencer','Teagan','Devon','Peyton','Kendall','Ainsley','Brooks'
  ];
  const LAST = [
    'Chen','Kim','Rivera','Park','Wong','Johnson','Williams','Martinez','Brown','Davis',
    'Miller','Wilson','Moore','Taylor','Anderson','Thomas','Jackson','White','Harris','Clark',
    'Lewis','Robinson','Walker','Young','Allen','King','Wright','Scott','Torres','Nguyen',
    'Hill','Flores','Green','Adams','Nelson','Baker','Hall','Campbell','Mitchell','Carter',
    'Roberts','Gomez','Phillips','Evans','Turner','Diaz','Cruz','Edwards','Patel','Okafor'
  ];

  const CLASS_CONFIGS = [
    { id: 'c1', name: 'Digital Literacy', count: 29 },
    { id: 'c2', name: 'AP Research',      count: 32 },
    { id: 'c3', name: 'Media & Society',  count: 27 },
  ];

  // Archetype weights — must sum to 1
  const ARCHETYPES = [
    { type: 'improver',     w: 0.27 },
    { type: 'high',         w: 0.18 },
    { type: 'passive',      w: 0.24 },
    { type: 'flagged',      w: 0.10 },
    { type: 'inconsistent', w: 0.13 },
    { type: 'missing',      w: 0.08 },
  ];

  function pickArchetype() {
    const r = rng();
    let acc = 0;
    for (const a of ARCHETYPES) { acc += a.w; if (r < acc) return a.type; }
    return 'passive';
  }

  const usedNames = new Set();
  function genName() {
    for (let attempt = 0; attempt < 30; attempt++) {
      const fn = FIRST[Math.floor(rng() * FIRST.length)];
      const ln = LAST[Math.floor(rng() * LAST.length)];
      const name = `${fn} ${ln}`;
      if (!usedNames.has(name)) { usedNames.add(name); return name; }
    }
    // fallback: append index
    const name = `${FIRST[0]} ${LAST[usedNames.size % LAST.length]} ${usedNames.size}`;
    usedNames.add(name);
    return name;
  }

  const students = [];
  const classes  = [];
  let sIdx = 1;

  for (const cfg of CLASS_CONFIGS) {
    const studentIds = [];
    for (let i = 0; i < cfg.count; i++) {
      const name      = genName();
      const initials  = name.split(' ').map(p => p[0]).join('');
      const archetype = pickArchetype();
      students.push({ id: `s${sIdx}`, name, initials, archetype });
      studentIds.push(`s${sIdx}`);
      sIdx++;
    }
    classes.push({ id: cfg.id, name: cfg.name, studentIds });
  }

  const ALL_FLAGS = ['shadow-session-pattern','unnatural-fluency','provenance-mismatch','stylistic-inconsistency'];

  function baseFor(archetype) {
    switch (archetype) {
      case 'high':         return { pq: ri(3,4), su: ri(3,4), cs: ri(3,4), oc: ri(3,4) };
      case 'improver':     return { pq: ri(1,2), su: ri(1,3), cs: ri(1,2), oc: ri(1,2) };
      case 'passive':      return { pq: ri(1,2), su: ri(1,2), cs: ri(1,2), oc: ri(1,2) };
      case 'flagged':      return { pq: ri(1,2), su: ri(1,2), cs: ri(1,2), oc: ri(1,2) };
      case 'inconsistent': return { pq: ri(2,3), su: ri(2,3), cs: ri(1,3), oc: ri(2,3) };
      case 'missing':      return { pq: ri(1,3), su: ri(1,3), cs: ri(1,2), oc: ri(1,3) };
      default:             return { pq: 2, su: 2, cs: 2, oc: 2 };
    }
  }

  function genSubs(student, assignment) {
    const { archetype } = student;

    // Non-submission probability
    if (archetype === 'missing'  && rng() < 0.55) return [];
    if (archetype === 'passive'  && rng() < 0.12) return [];
    if (rng() < 0.04) return [];

    const subCount = (() => {
      const open = assignment.status === 'open';
      switch (archetype) {
        case 'high':         return ri(open ? 1 : 2, open ? 2 : 4);
        case 'improver':     return ri(open ? 1 : 2, open ? 3 : 4);
        case 'flagged':      return ri(2, 3);
        case 'missing':      return ri(1, open ? 1 : 2);
        default:             return ri(1, open ? 2 : 3);
      }
    })();

    const due       = assignment.due;
    const windowMs  = 14 * 24 * 3600000;
    const startMs   = due.getTime() - windowMs;
    const base      = baseFor(archetype);
    const delta     = archetype === 'improver' ? 0.65 : archetype === 'high' ? 0.2 : 0.15;
    const flagOnIdx = archetype === 'flagged' ? subCount - 1 : -1;
    const subs      = [];

    for (let i = 0; i < subCount; i++) {
      const isFlagged = i === flagOnIdx;
      let pq, su, cs, oc;

      if (isFlagged) {
        pq = ri(4, 5); su = ri(4, 5); cs = ri(4, 5); oc = ri(4, 5);
      } else {
        const jitter = () => (rng() < 0.3 ? (rng() < 0.5 ? 1 : -1) : 0);
        pq = clamp(Math.round(base.pq + delta * i + jitter()), 1, 5);
        su = clamp(Math.round(base.su + delta * i + jitter()), 1, 5);
        cs = clamp(Math.round(base.cs + delta * i + jitter()), 1, 5);
        oc = clamp(Math.round(base.oc + delta * i + jitter()), 1, 5);
      }

      // Spread timestamps across the window; flagged spike is minutes after previous
      let ts;
      if (isFlagged && subs.length > 0) {
        ts = new Date(subs[subs.length - 1].ts.getTime() + ri(4, 14) * 60000);
      } else {
        const frac   = subCount === 1 ? 0.7 : i / (subCount - 1);
        const noise  = (rng() - 0.5) * 3600000 * 10;
        const offset = clamp(windowMs * frac + noise, 3600000, windowMs - 3600000);
        ts = new Date(startMs + offset);
      }

      const sub = { ts, pq, su, cs, oc };
      if (isFlagged) {
        sub.integrityFlags = shuffle(ALL_FLAGS).slice(0, ri(1, 2));
      }
      subs.push(sub);
    }

    return subs;
  }

  const submissions = {};
  for (const student of students) {
    for (const a of ASSIGNMENTS) {
      submissions[`${student.id}_${a.id}`] = genSubs(student, a);
    }
  }

  // Strip internal archetype field
  const cleanStudents = students.map(({ id, name, initials }) => ({ id, name, initials }));
  return { STUDENTS: cleanStudents, CLASSES: classes, SUBMISSIONS: submissions };
}

const { STUDENTS, CLASSES, SUBMISSIONS } = generateMockData(42);

// ── Helpers ───────────────────────────────────────────────────────────────────

function total(sub) { return sub.pq + sub.su + sub.cs + sub.oc; }

function samr(t) {
  if (t >= 17) return { label: 'Redefinition', cls: 'samr-redef' };
  if (t >= 13) return { label: 'Modification',  cls: 'samr-mod'  };
  if (t >= 9)  return { label: 'Augmentation',  cls: 'samr-aug'  };
  return            { label: 'Substitution',  cls: 'samr-sub'  };
}

function submissionStatus(subs, assignment) {
  if (!subs.length) return assignment.status === 'closed'
    ? { label: 'Missing',     cls: 'status-missing'     }
    : { label: 'Not started', cls: 'status-not-started' };
  return assignment.status === 'closed'
    ? { label: 'Final', cls: 'status-final' }
    : { label: 'Draft', cls: 'status-draft' };
}

const REASON_TO_TREND = {
  'Passive engagement across all submissions':         'passive',
  'Tends to accept AI responses without questioning':  'passive',
  'Rarely challenges or refines AI suggestions':       'low-skepticism',
  'Most ideas appear AI-initiated':                    'ai-ideas',
  'Engagement declining across recent submissions':    'declining',
};

function detectTrends() {
  const allStudents = CLASSES.flatMap(cls =>
    cls.studentIds.map(sid => ({ student: STUDENTS.find(x => x.id === sid), cls }))
  ).filter(({ student }) => student);

  const groups = {};
  allStudents.forEach(({ student, cls }) => {
    const sig = getStudentSignal(student.id);
    if (sig.status !== 'attention') return;
    const tid = REASON_TO_TREND[sig.reason];
    if (!tid) return;
    if (!groups[tid]) groups[tid] = [];
    groups[tid].push({ student, cls });
  });

  return Object.entries(groups)
    .filter(([, arr]) => arr.length >= 2)
    .sort((a, b) => b[1].length - a[1].length)
    .map(([id, students]) => ({ id, students, meta: TREND_META[id] }))
    .filter(t => t.meta);
}

function checkFlag(subs) {
  const flags = [];
  for (let i = 1; i < subs.length; i++) {
    const prev = subs[i-1], curr = subs[i];
    const mins      = (curr.ts - prev.ts) / 60000;
    const scoreDiff = total(curr) - total(prev);
    const maxDim    = Math.max(...['pq','su','cs','oc'].map(d => curr[d] - prev[d]));
    if (mins <= 10 && (scoreDiff >= 5 || maxDim >= 3)) {
      flags.push({ submissionIndex: i, mins: Math.round(mins), scoreDiff, maxDim });
    }
  }
  return flags;
}

function getSubs(sid, aid)      { return SUBMISSIONS[`${sid}_${aid}`] || []; }
function latestSub(subs)        { return subs.length ? subs[subs.length - 1] : null; }
function getIntegrityFlags(subs){ return [...new Set(subs.flatMap(s => s.integrityFlags || []))]; }

function hasAnyFlag(sid) {
  return ASSIGNMENTS.some(a => {
    const subs = getSubs(sid, a.id);
    return checkFlag(subs).length > 0 || getIntegrityFlags(subs).length > 0;
  });
}

function getStudentSignal(studentId, assignmentId = null) {
  const assignments = assignmentId
    ? [ASSIGNMENTS.find(a => a.id === assignmentId)].filter(Boolean)
    : ASSIGNMENTS;

  const integrityKeys = [];
  let hasSpikeFlag = false;

  assignments.forEach(a => {
    const subs = getSubs(studentId, a.id);
    getIntegrityFlags(subs).forEach(f => { if (!integrityKeys.includes(f)) integrityKeys.push(f); });
    if (checkFlag(subs).length) hasSpikeFlag = true;
  });

  if (integrityKeys.length || hasSpikeFlag) {
    const has = k => integrityKeys.includes(k);
    let reason;
    if (has('shadow-session-pattern') && has('unnatural-fluency')) {
      reason = 'Multiple integrity signals — consider a conversation';
    } else if (has('shadow-session-pattern')) {
      reason = 'Unusually passive acceptance pattern';
    } else if (has('unnatural-fluency')) {
      reason = 'Writing style inconsistent with live composition';
    } else if (has('stylistic-inconsistency')) {
      reason = 'Vocabulary shifts sharply between turns';
    } else if (has('provenance-mismatch')) {
      reason = 'Essay credits ideas the AI introduced first';
    } else {
      reason = 'Score jumped sharply between two submissions';
    }
    return { status: 'review', reason };
  }

  const allSubs = assignments.flatMap(a => getSubs(studentId, a.id));
  if (!allSubs.length) return { status: 'on-track', reason: '' };

  const avg = dim => allSubs.reduce((s, sub) => s + sub[dim], 0) / allSubs.length;
  const avgPQ    = avg('pq');
  const avgCS    = avg('cs');
  const avgOC    = avg('oc');
  const avgTotal = allSubs.reduce((s, sub) => s + total(sub), 0) / allSubs.length;

  const sorted   = [...allSubs].sort((a, b) => a.ts - b.ts);
  const declining = sorted.length >= 3 && total(sorted[sorted.length - 1]) < total(sorted[0]) - 2;

  if (declining)              return { status: 'attention', reason: 'Engagement declining across recent submissions' };
  if (avgTotal < 9)           return { status: 'attention', reason: 'Passive engagement across all submissions' };
  if (avgCS < 2.5 && avgPQ < 2.5) return { status: 'attention', reason: 'Tends to accept AI responses without questioning' };
  if (avgCS < 2.5)            return { status: 'attention', reason: 'Rarely challenges or refines AI suggestions' };
  if (avgOC < 2.5)            return { status: 'attention', reason: 'Most ideas appear AI-initiated' };

  return { status: 'on-track', reason: '' };
}

function formatDate(d) {
  return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' })
    + ' ' + d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', hour12: true });
}

function sparklineSVG(subs, w = 72, h = 24) {
  const flags   = checkFlag(subs);
  const flagIdx = new Set(flags.map(f => f.submissionIndex));
  const totals  = subs.map(total);
  const MIN = 4, MAX = 20;
  const x = i => subs.length < 2 ? w / 2 : (i / (subs.length - 1)) * (w - 8) + 4;
  const y = t => h - 4 - ((t - MIN) / (MAX - MIN)) * (h - 8);
  if (!subs.length) return `<svg class="sparkline" width="${w}" height="${h}"></svg>`;
  const pts  = totals.map((t, i) => `${x(i)},${y(t)}`).join(' ');
  const line = subs.length > 1
    ? `<polyline points="${pts}" fill="none" stroke="var(--blue-light)" stroke-width="1.5"/>`
    : '';
  const dots = totals.map((t, i) =>
    `<circle cx="${x(i)}" cy="${y(t)}" r="2.5" fill="${flagIdx.has(i) ? 'var(--terra)' : 'var(--blue)'}" />`
  ).join('');
  return `<svg class="sparkline" width="${w}" height="${h}">${line}${dots}</svg>`;
}

function distributionBar(studentIds, assignmentId, w = 120, h = 10) {
  const n = studentIds.length;
  if (!n) return '';
  const counts = { Redefinition: 0, Modification: 0, Augmentation: 0, Substitution: 0, None: 0 };
  studentIds.forEach(sid => {
    const lat = latestSub(getSubs(sid, assignmentId));
    if (lat) counts[samr(total(lat)).label]++;
    else counts.None++;
  });
  const colors = { Redefinition: '#3B3EA8', Modification: '#6B7DD4', Augmentation: '#9B9DE0', Substitution: '#cccccc' };
  const levels = ['Redefinition', 'Modification', 'Augmentation', 'Substitution'];
  let x = 0;
  const rects = [];
  levels.forEach(l => {
    if (!counts[l]) return;
    const sw = (counts[l] / n) * w;
    rects.push(`<rect x="${x.toFixed(1)}" y="0" width="${sw.toFixed(1)}" height="${h}" fill="${colors[l]}"><title>${counts[l]} ${l}</title></rect>`);
    x += sw;
  });
  if (x < w - 0.5) {
    rects.push(`<rect x="${x.toFixed(1)}" y="0" width="${(w - x).toFixed(1)}" height="${h}" fill="#e5e5e2"><title>${counts.None} not submitted</title></rect>`);
  }
  return `<svg width="${w}" height="${h}" style="border-radius:3px;display:block;overflow:hidden">${rects.join('')}</svg>`;
}

// ── Drill panel ───────────────────────────────────────────────────────────────

function renderDrillPanel(subs, label, sig) {
  if (!subs.length) return `<div class="drill-panel"><em style="color:var(--text-muted);font-size:13px">No submissions for this assignment.</em></div>`;
  const flags   = checkFlag(subs);
  const flagIdx = new Set(flags.map(f => f.submissionIndex));
  const rows = [...subs].reverse().map((sub, ri) => {
    const i = subs.length - 1 - ri;
    const t        = total(sub);
    const s        = samr(t);
    const flagInfo = flagIdx.has(i) ? flags.find(f => f.submissionIndex === i) : null;
    const iFlags   = sub.integrityFlags || [];
    const isLast   = i === subs.length - 1;

    const flagLines = [];
    if (flagInfo) {
      flagLines.push(`<div class="flag-line">
        <span>Score jumped +${flagInfo.scoreDiff} points in ${flagInfo.mins} minutes</span>
        <a class="flag-learn-more" onclick="openFlagTray('score-spike',{scoreDiff:${flagInfo.scoreDiff},mins:${flagInfo.mins}});event.stopPropagation()">Learn more</a>
      </div>`);
    }
    iFlags.forEach(f => {
      flagLines.push(`<div class="flag-line">
        <span>${FLAG_META[f]?.desc || f}</span>
        <a class="flag-learn-more" onclick="openFlagTray('${f}');event.stopPropagation()">Learn more</a>
      </div>`);
    });

    const flagRow = flagLines.length
      ? `<div class="integrity-flags-row">
           <span style="font-size:11px;font-weight:600;color:var(--terra);flex-shrink:0;margin-top:1px">⚑</span>
           <div style="flex:1;display:flex;flex-direction:column;gap:3px">${flagLines.join('')}</div>
         </div>`
      : '';

    const statusChip = isLast
      ? `<span class="sub-chip" style="font-size:10px;font-weight:600;color:var(--green);background:var(--green-tint);padding:2px 7px;border-radius:20px">Final</span>`
      : `<span class="sub-chip" style="font-size:10px;font-weight:600;color:var(--text-muted);background:var(--grey-tint);border:1px solid var(--border);padding:2px 7px;border-radius:20px">Draft</span>`;

    return `<div class="sub-row ${flagInfo || iFlags.length ? 'flagged' : ''}">
      <div class="sub-row-main">
        <span class="sub-num">#${i + 1}</span>
        ${statusChip}
        <span class="sub-date">${formatDate(sub.ts)}</span>
        <span class="sub-total">${t}<span style="font-size:11px;font-weight:400;color:var(--text-muted)">/20</span></span>
        <div class="dim-scores" style="flex:1">
          <span class="dim-score">PQ <span>${sub.pq}</span></span>
          <span class="dim-score">SU <span>${sub.su}</span></span>
          <span class="dim-score">CS <span>${sub.cs}</span></span>
          <span class="dim-score">OC <span>${sub.oc}</span></span>
        </div>
        <span class="samr-badge ${s.cls}" style="width:100px;text-align:center;flex-shrink:0">${s.label}</span>
      </div>
      ${flagRow}
    </div>`;
  }).join('');
  const engagementNote = sig && sig.status === 'attention' && sig.reason
    ? `<div style="padding:8px 14px;font-size:11px;color:var(--text-muted);border-top:1px solid var(--border)">${sig.reason}</div>`
    : '';
  return `<div class="drill-panel">
    <div class="drill-panel-header">Submission history — ${label}</div>
    <div class="sub-history">${rows}</div>
    ${engagementNote}
  </div>`;
}

let activeTab            = 'overview';
let activeClass          = 'overview';
let activeAssignment     = 'overview';
let activeStudent        = 'overview';
let studentSearch        = '';
let studentFilter        = 'all';
let expandedInAssignment = null;
let expandedInClass      = null;
let expandedInStudent    = null;
let classSort            = { col: null,   dir: 'asc' };
let assignmentSort       = { col: 'name', dir: 'asc' };

// ── Sidebar renders ───────────────────────────────────────────────────────────

function renderClassSidebar() {
  const items = CLASSES.map(c => {
    const students = c.studentIds.map(sid => STUDENTS.find(s => s.id === sid)).filter(Boolean);
    const hasFlags = students.some(s => hasAnyFlag(s.id));
    const active   = c.id === activeClass;
    return `<div class="sidebar-item ${active ? 'active' : ''}" onclick="selectClass('${c.id}')">
      <div style="flex:1;min-width:0">
        <div class="sidebar-item-name">${c.name}</div>
        <div class="sidebar-item-sub">${students.length} student${students.length !== 1 ? 's' : ''}</div>
      </div>
      ${hasFlags ? '<span class="flag-dot">⚑</span>' : ''}
    </div>`;
  }).join('');
  return `<div class="sidebar-item ${activeClass === 'overview' ? 'active' : ''}" onclick="selectClass('overview')" style="margin-bottom:4px">
    <div style="flex:1;min-width:0">
      <div class="sidebar-item-name">Overview</div>
      <div class="sidebar-item-sub">All classes at a glance</div>
    </div>
  </div>
  <div style="height:1px;background:var(--border);margin:4px 0 8px"></div>
  ${items}`;
}

function renderAssignmentSidebar() {
  function item(a) {
    const active   = a.id === activeAssignment;
    const dueStr   = a.due.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
    const hasFlags = STUDENTS.some(s => {
      const subs = getSubs(s.id, a.id);
      return checkFlag(subs).length > 0 || getIntegrityFlags(subs).length > 0;
    });
    return `<div class="sidebar-item ${active ? 'active' : ''}" onclick="selectAssignment('${a.id}')">
      <div style="flex:1;min-width:0">
        <div class="sidebar-item-name">${a.name}</div>
        <div class="sidebar-item-sub">Due ${dueStr}</div>
      </div>
      ${hasFlags ? '<span class="flag-dot">⚑</span>' : ''}
    </div>`;
  }
  const open   = ASSIGNMENTS.filter(a => a.status === 'open');
  const closed = ASSIGNMENTS.filter(a => a.status === 'closed');
  let items = '';
  if (open.length)   items += `<div class="sidebar-section">Open</div>${open.map(item).join('')}`;
  if (closed.length) items += `<div class="sidebar-section" style="margin-top:${open.length ? 4 : 0}px">Closed</div>${closed.map(item).join('')}`;
  return `<div class="sidebar-item ${activeAssignment === 'overview' ? 'active' : ''}" onclick="selectAssignment('overview')" style="margin-bottom:4px">
    <div style="flex:1;min-width:0">
      <div class="sidebar-item-name">Overview</div>
      <div class="sidebar-item-sub">All assignments at a glance</div>
    </div>
  </div>
  <div style="height:1px;background:var(--border);margin:4px 0 8px"></div>
  ${items}`;
}

function signalPill(sig) {
  if (sig.status === 'review') return `<span class="signal-pill-review">⚑ review</span>`;
  return '';
}

function studentSidebarItem(s) {
  const active = s.id === activeStudent;
  const sig    = getStudentSignal(s.id);
  return `<div class="sidebar-item ${active ? 'active' : ''}" onclick="selectStudent('${s.id}')">
    <div style="flex:1;min-width:0">
      <div class="sidebar-item-name">${s.name}</div>
    </div>
    ${signalPill(sig)}
  </div>`;
}

function renderStudentList() {
  const q = studentSearch.toLowerCase().trim();

  let candidates = CLASSES.flatMap(cls =>
    cls.studentIds.map(sid => ({ student: STUDENTS.find(s => s.id === sid), cls }))
  ).filter(({ student }) => student);

  if (q) candidates = candidates.filter(({ student }) => student.name.toLowerCase().includes(q));

  if (studentFilter !== 'all') {
    candidates = candidates.filter(({ student }) => getStudentSignal(student.id).status === studentFilter);
  }

  if (!candidates.length) return `<div style="padding:10px 16px;font-size:12px;color:var(--text-muted)">No students match this filter</div>`;

  if (q) {
    return candidates.map(({ student }) => studentSidebarItem(student)).join('');
  }

  return CLASSES.map(cls => {
    const classStudents = candidates.filter(c => c.cls.id === cls.id).map(c => c.student);
    if (!classStudents.length) return '';
    return `<div class="sidebar-section">${cls.name}</div>`
      + classStudents.map(s => studentSidebarItem(s)).join('');
  }).join('');
}

function renderStudentSidebar() {
  return `<div class="sidebar-item ${activeStudent === 'overview' ? 'active' : ''}" onclick="selectStudent('overview')" style="margin-bottom:4px">
      <div style="flex:1;min-width:0">
        <div class="sidebar-item-name">Overview</div>
        <div class="sidebar-item-sub">All students by priority</div>
      </div>
    </div>
    <div style="height:1px;background:var(--border);margin:4px 0 8px"></div>
    <div class="sidebar-search">
      <input type="text" id="student-search-input" placeholder="Search students…"
             oninput="filterStudents(this.value)" value="${studentSearch}">
    </div>
    <div class="filter-chips">
      <button class="filter-chip ${studentFilter === 'all'    ? 'active-all'    : ''}" data-filter="all"    onclick="setStudentFilter('all')">All</button>
      <button class="filter-chip ${studentFilter === 'review' ? 'active-review' : ''}" data-filter="review" onclick="setStudentFilter('review')">⚑ Review</button>
    </div>
    <div id="student-list">${renderStudentList()}</div>`;
}

function renderSidebar() {
  const el = document.getElementById('sidebar');
  if      (activeTab === 'class')      el.innerHTML = renderClassSidebar();
  else if (activeTab === 'assignment') el.innerHTML = renderAssignmentSidebar();
  else                                  el.innerHTML = renderStudentSidebar();
}

// ── Class drill panel ─────────────────────────────────────────────────────────

function renderClassDrillPanel(a, students) {
  const isClosed = a.status === 'closed';

  const noSubs   = students.filter(s => getSubs(s.id, a.id).length === 0);
  const hasSubs  = students.filter(s => getSubs(s.id, a.id).length > 0);

  // Unsubmitted always at top; within each group keep original roster order
  const ordered = [...noSubs, ...hasSubs];

  const rows = ordered.map(s => {
    const subs      = getSubs(s.id, a.id);
    const lat       = latestSub(subs);
    const t         = lat ? total(lat) : null;
    const st        = submissionStatus(subs, a);
    const sig       = getStudentSignal(s.id, a.id);
    const isMissing = isClosed && !subs.length;

    return `<div class="class-student-row ${isMissing ? 'missing' : ''}"
                 onclick="gotoStudentFromClass('${s.id}');event.stopPropagation()">
      <div class="avatar" style="width:24px;height:24px;font-size:10px;flex-shrink:0">${s.initials}</div>
      <div style="flex:1;min-width:0">
        <div style="font-size:13px;font-weight:500;display:flex;align-items:center;gap:6px">
          ${s.name}
          ${signalPill(sig)}
        </div>
      </div>
      <span class="chip ${st.cls}" style="font-size:10px;flex-shrink:0">${st.label}</span>
      ${t !== null
        ? `<span style="font-weight:700;font-size:13px;min-width:36px;text-align:right;flex-shrink:0">${t}<span style="font-size:11px;font-weight:400;color:var(--text-muted)">/20</span></span>
           <span class="samr-badge ${samr(t).cls}" style="font-size:10px;min-width:90px;text-align:center;flex-shrink:0">${samr(t).label}</span>`
        : `<span style="min-width:36px"></span><span style="min-width:90px"></span>`}
    </div>`;
  }).join('');

  return `<div class="drill-panel">
    <div class="drill-panel-header" style="display:flex;justify-content:space-between;align-items:center">
      <span>Students — ${a.name}</span>
      <a style="font-size:11px;font-weight:600;color:var(--blue);cursor:pointer;text-decoration:none"
         onclick="gotoAssignment('${a.id}');event.stopPropagation()">View full assignment →</a>
    </div>
    <div style="display:flex;flex-direction:column;gap:2px">${rows}</div>
  </div>`;
}

// ── Content renders ───────────────────────────────────────────────────────────

function renderOverviewContent() {
  const allStudents = CLASSES.flatMap(cls =>
    cls.studentIds.map(sid => ({ student: STUDENTS.find(x => x.id === sid), cls }))
  ).filter(({ student }) => student);

  const review     = allStudents.filter(({ student }) => getStudentSignal(student.id).status === 'review');
  const trends     = detectTrends();
  const openAssign = ASSIGNMENTS.filter(a => a.status === 'open');
  const totalMissing = openAssign.reduce((sum, a) =>
    sum + allStudents.filter(({ student }) => !getSubs(student.id, a.id).length).length, 0);

  // ── Stat tiles ──
  function statTile(value, label, color, tintBg, borderColor, onclickFn) {
    return `<div style="background:${tintBg};border:1px solid ${borderColor};border-radius:8px;padding:16px 18px;flex:1;min-width:110px;${onclickFn ? 'cursor:pointer' : ''}" ${onclickFn ? `onclick="${onclickFn}"` : ''}>
      <div style="font-size:28px;font-weight:800;color:${color};line-height:1">${value}</div>
      <div style="font-size:11px;font-weight:600;color:${color};margin-top:5px;opacity:0.85">${label}</div>
    </div>`;
  }

  const tiles = `<div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:24px">
    ${statTile(
      review.length,
      review.length ? 'Need review' : 'No flags',
      review.length ? 'var(--terra)' : 'var(--green)',
      review.length ? 'var(--terra-tint)' : 'var(--green-tint)',
      review.length ? 'var(--terra-light)' : '#a8d5be',
      review.length ? "gotoStudentFilter('review')" : ''
    )}
    ${statTile(trends.length, `Behavioral pattern${trends.length !== 1 ? 's' : ''} detected`, 'var(--blue-mid)', 'var(--blue-tint)', '#c5c7e8', '')}
    ${totalMissing ? statTile(totalMissing, 'Missing submissions', 'var(--amber)', 'var(--amber-tint)', '#d4a87a', '') : ''}
    ${statTile(openAssign.length, `Open assignment${openAssign.length !== 1 ? 's' : ''}`, 'var(--text-mid)', 'var(--surface)', 'var(--border)', '')}
    ${statTile(allStudents.length, 'Students', 'var(--text-mid)', 'var(--surface)', 'var(--border)', '')}
  </div>`;

  // ── Integrity flags list ──
  const reviewSection = review.length ? `<div style="margin-bottom:20px">
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">
      <span style="font-size:13px;font-weight:600;color:var(--text)">Students — <span style="color:var(--terra)">⚑ review</span></span>
      <span style="font-size:11px;background:var(--terra-tint);color:var(--terra);border:1px solid var(--terra-light);border-radius:20px;padding:1px 7px;font-weight:600">${review.length}</span>
    </div>
    <div style="background:var(--surface);border:1px solid var(--border);border-radius:8px;overflow:hidden">
      ${review.map(({ student, cls }, i) => {
        const flaggedAssign = ASSIGNMENTS.filter(a => {
          const subs = getSubs(student.id, a.id);
          return checkFlag(subs).length > 0 || getIntegrityFlags(subs).length > 0;
        });
        const detail = flaggedAssign.length ? 'Flagged: ' + flaggedAssign.map(a => a.name).join(', ') : '';
        return `<div style="display:flex;align-items:center;gap:10px;padding:10px 14px;${i > 0 ? 'border-top:1px solid var(--border);' : ''}cursor:pointer"
                     onmouseover="this.style.background='var(--terra-tint)'" onmouseout="this.style.background=''"
                     onclick="gotoStudentFromClass('${student.id}')">
          <div class="avatar" style="width:28px;height:28px;font-size:10px;background:var(--terra-tint);color:var(--terra);flex-shrink:0">${student.initials}</div>
          <div style="flex:1;min-width:0">
            <div style="font-size:13px;font-weight:600">${student.name}</div>
            <div style="font-size:11px;color:var(--text-muted);margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${cls.name}${detail ? ' · ' + detail : ''}</div>
          </div>
          <span style="font-size:11px;color:var(--blue);font-weight:600;flex-shrink:0">View →</span>
        </div>`;
      }).join('')}
    </div>
  </div>` : '';

  // ── Trend cards ──
  const trendsSection = trends.length ? `<div>
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">
      <span style="font-size:13px;font-weight:700;color:var(--text)">Behavioral patterns</span>
      <span style="font-size:11px;color:var(--text-muted)">Patterns detected across your classes based on how students are using AI</span>
    </div>
    <div style="display:flex;flex-direction:column;gap:10px">
      ${trends.map(({ id, students, meta }) => {
        const preview = students.slice(0, 4);
        const overflow = students.length - preview.length;
        // Spread across classes for context
        const classCounts = CLASSES.map(cls => {
          const n = students.filter(x => x.cls.id === cls.id).length;
          return n ? `${cls.name} ${n}` : null;
        }).filter(Boolean).join(' · ');
        return `<div style="background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--blue-mid);border-radius:8px;padding:16px 18px">
          <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:4px">
            <div>
              <span style="font-size:14px;font-weight:700;color:var(--text)">${meta.label}</span>
              <span style="font-size:11px;font-weight:600;background:var(--blue-tint);color:var(--blue);border:1px solid #c5c7e8;border-radius:20px;padding:1px 8px;margin-left:8px">${students.length} student${students.length !== 1 ? 's' : ''}</span>
            </div>
          </div>
          <div style="font-size:12px;color:var(--text-muted);margin-bottom:12px">${classCounts}</div>

          <div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.6px;color:var(--text-muted);margin-bottom:5px">What this looks like</div>
          <div style="font-size:13px;color:var(--text-mid);line-height:1.6;margin-bottom:12px">${meta.what}</div>

          <div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.6px;color:var(--blue-mid);margin-bottom:5px">What to try</div>
          <div style="font-size:13px;color:var(--text-mid);line-height:1.6;margin-bottom:14px;padding:10px 12px;background:var(--blue-tint);border-radius:5px;border-left:2px solid var(--blue-light)">${meta.whatToTry}</div>

        </div>`;
      }).join('')}
    </div>
  </div>` : '';

  const allClear = !review.length && !trends.length
    ? `<div style="text-align:center;padding:40px 24px;background:var(--surface);border:1px solid var(--border);border-radius:8px">
        <div style="font-size:22px;margin-bottom:8px">✓</div>
        <div style="font-weight:600;font-size:14px;color:var(--green)">All students on track</div>
        <div style="font-size:12px;color:var(--text-muted);margin-top:4px">No flags or behavioral patterns detected</div>
      </div>` : '';

  // ── Open assignments ──
  const assignSection = `<div style="margin-bottom:16px">
    <div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.7px;color:var(--text-muted);margin-bottom:8px">Open assignments</div>
    ${openAssign.length ? openAssign.map(a => {
      const submitted  = allStudents.filter(({ student }) => getSubs(student.id, a.id).length > 0).length;
      const n          = allStudents.length;
      const missing    = n - submitted;
      const dueStr     = a.due.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
      const daysLeft   = Math.ceil((a.due - new Date()) / 86400000);
      const bar        = distributionBar(allStudents.map(({ student }) => student.id), a.id, 200);
      return `<div style="background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:13px 15px;margin-bottom:8px;cursor:pointer"
                   onclick="gotoAssignment('${a.id}')">
        <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:10px">
          <div>
            <div style="font-size:13px;font-weight:600">${a.name}</div>
            <div style="font-size:11px;color:var(--text-muted);margin-top:2px">Due ${dueStr} · ${daysLeft >= 0 ? `${daysLeft}d left` : 'Past due'}</div>
          </div>
          <div style="text-align:right;flex-shrink:0">
            <span style="font-weight:700;font-size:13px;color:${missing ? 'var(--amber)' : 'var(--green)'}">${submitted}</span><span style="font-size:11px;color:var(--text-muted)">/${n} submitted</span>
            ${missing ? `<div style="font-size:11px;color:var(--terra)">${missing} missing</div>` : ''}
          </div>
        </div>
        ${bar}
        <div style="margin-top:8px;display:flex;gap:8px;flex-wrap:wrap">
          ${CLASSES.map(cls => {
            const cs   = cls.studentIds.map(sid => STUDENTS.find(s => s.id === sid)).filter(Boolean);
            const csub = cs.filter(s => getSubs(s.id, a.id).length > 0).length;
            return `<span style="font-size:11px;color:var(--text-muted)">${cls.name} <strong style="color:var(--text)">${csub}/${cs.length}</strong></span>`;
          }).join('<span style="color:var(--border);margin:0 3px">·</span>')}
        </div>
      </div>`;
    }).join('') : `<div style="font-size:13px;color:var(--text-muted);padding:14px;text-align:center;background:var(--surface);border:1px solid var(--border);border-radius:8px">No open assignments</div>`}
  </div>`;

  // ── Class health ──
  const classSection = `<div>
    <div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.7px;color:var(--text-muted);margin-bottom:8px">Classes</div>
    <div style="display:flex;flex-direction:column;gap:6px">
      ${CLASSES.map(cls => {
        const students   = cls.studentIds.map(sid => STUDENTS.find(s => s.id === sid)).filter(Boolean);
        const flagCount = students.filter(s => getStudentSignal(s.id).status === 'review').length;
        return `<div style="background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:11px 14px;display:flex;align-items:center;gap:12px;cursor:pointer"
                     onclick="gotoClass('${cls.id}')">
          <div style="flex:1;min-width:0">
            <div style="font-size:13px;font-weight:600">${cls.name}</div>
            <div style="font-size:11px;color:var(--text-muted);margin-top:1px">${students.length} students</div>
          </div>
          <div style="display:flex;gap:5px;align-items:center;flex-shrink:0">
            ${flagCount ? `<span class="chip chip-terra" style="font-size:10px">⚑ ${flagCount}</span>` : `<span style="font-size:11px;color:var(--green);font-weight:600">✓ On track</span>`}
          </div>
        </div>`;
      }).join('')}
    </div>
  </div>`;

  const date = new Date().toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' });

  return `
    <div class="content-header">
      <div class="content-title">Overview</div>
      <div class="content-meta">${date}</div>
    </div>
    ${tiles}
    <div style="display:grid;grid-template-columns:1fr 300px;gap:20px;align-items:start">
      <div>
        ${reviewSection}
        ${trendsSection}
        ${allClear}
      </div>
      <div>
        ${assignSection}
        ${classSection}
      </div>
    </div>
  `;
}

function renderClassOverview() {
  const totalFlags = STUDENTS.filter(s => hasAnyFlag(s.id)).length;
  const totalStudents = STUDENTS.length;

  const cards = CLASSES.map(cls => {
    const students = cls.studentIds.map(sid => STUDENTS.find(s => s.id === sid)).filter(Boolean);
    const flagged  = students.filter(s => hasAnyFlag(s.id));
    const allSubs  = ASSIGNMENTS.flatMap(a => students.map(s => getSubs(s.id, a.id))).flat();
    const openAssignments = ASSIGNMENTS.filter(a => a.status === 'open');
    const submissionStats = openAssignments.map(a => {
      const submitted = students.filter(s => getSubs(s.id, a.id).length > 0).length;
      return { name: a.name, submitted, total: students.length };
    });

    const flagLines = flagged.map(s => {
      const sig = getStudentSignal(s.id);
      return `<div style="display:flex;align-items:center;gap:6px;padding:4px 0;border-top:1px solid var(--border)">
        <div class="avatar" style="width:22px;height:22px;font-size:9px;flex-shrink:0">${s.initials}</div>
        <span style="font-size:12px;font-weight:500;flex:1">${s.name}</span>
        ${signalPill(sig)}
      </div>`;
    }).join('');

    const submissionLines = submissionStats.map(({ name, submitted, total }) =>
      `<div style="display:flex;align-items:center;gap:8px;font-size:11px;color:var(--text-muted);padding:3px 0;border-top:1px solid var(--border)">
        <span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${name}</span>
        <span style="flex-shrink:0;font-weight:600;color:${submitted < total ? 'var(--terra)' : 'var(--text)'}">${submitted}/${total}</span>
      </div>`
    ).join('');

    return `<div class="overview-card" onclick="selectClass('${cls.id}')">
      <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:12px">
        <div>
          <div style="font-weight:600;font-size:14px">${cls.name}</div>
          <div style="font-size:11px;color:var(--text-muted);margin-top:2px">${students.length} student${students.length !== 1 ? 's' : ''} · ${ASSIGNMENTS.length} assignment${ASSIGNMENTS.length !== 1 ? 's' : ''}</div>
        </div>
        ${flagged.length ? `<span class="flag-badge" style="flex-shrink:0">⚑ review</span>` : ''}
      </div>
      ${submissionLines ? `<div style="margin-top:8px">${submissionLines}</div>` : ''}
      ${flagLines ? `<div style="margin-top:4px">${flagLines}</div>` : ''}
    </div>`;
  }).join('');

  return `
    <div class="content-header">
      <div class="content-title">Classes</div>
      <div class="content-meta">${CLASSES.length} class${CLASSES.length !== 1 ? 'es' : ''} · ${totalStudents} students${totalFlags ? ` · <span style="color:var(--terra)">⚑ review</span>` : ''}</div>
    </div>
    <div style="display:flex;flex-direction:column;gap:8px">${cards}</div>
  `;
}

function renderAssignmentOverview() {
  const allStudents = CLASSES.flatMap(cls =>
    cls.studentIds.map(sid => STUDENTS.find(s => s.id === sid)).filter(Boolean)
  );
  const n = allStudents.length;

  function assignmentCard(a) {
    const dueStr    = a.due.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
    const submitted = allStudents.filter(s => getSubs(s.id, a.id).length > 0).length;
    const missing   = a.status === 'closed' ? n - submitted : 0;
    const flagged   = allStudents.filter(s => {
      const subs = getSubs(s.id, a.id);
      return checkFlag(subs).length > 0 || getIntegrityFlags(subs).length > 0;
    });
    const bar = distributionBar(allStudents.map(s => s.id), a.id, 160);

    const flagLines = flagged.map(s => {
      const sig = getStudentSignal(s.id, a.id);
      return `<div style="display:flex;align-items:center;gap:6px;padding:4px 0;border-top:1px solid var(--border);cursor:pointer;border-radius:4px"
                   onmouseover="this.style.background='var(--terra-tint)'" onmouseout="this.style.background=''"
                   onclick="event.stopPropagation();gotoStudentFromClass('${s.id}')">
        <div class="avatar" style="width:22px;height:22px;font-size:9px;flex-shrink:0">${s.initials}</div>
        <span style="font-size:12px;font-weight:500;flex:1">${s.name}</span>
        ${signalPill(sig)}
        <span style="font-size:11px;color:var(--blue);font-weight:600;flex-shrink:0">View →</span>
      </div>`;
    }).join('');

    return `<div class="overview-card" onclick="selectAssignment('${a.id}')">
      <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:12px">
        <div style="flex:1;min-width:0">
          <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
            <span style="font-weight:600;font-size:13px">${a.name}</span>
            <span class="chip ${a.status === 'open' ? 'chip-amber' : 'chip-grey'}" style="font-size:10px">${a.status === 'open' ? 'Open' : 'Closed'}</span>
          </div>
          <div style="font-size:11px;color:var(--text-muted);margin-top:2px">Due ${dueStr}</div>
        </div>
        <div style="text-align:right;flex-shrink:0">
          <div style="font-size:12px;font-weight:600;color:${missing ? 'var(--terra)' : 'var(--text)'}">${submitted}<span style="font-weight:400;color:var(--text-muted)">/${n} submitted</span></div>
          ${missing ? `<div style="font-size:11px;color:var(--terra)">${missing} missing</div>` : ''}
        </div>
      </div>
      <div style="margin-top:10px;display:flex;align-items:center;gap:10px">
        ${bar}
        ${flagged.length ? `<span class="flag-badge">⚑ review</span>` : ''}
      </div>
      ${flagLines ? `<div style="margin-top:4px">${flagLines}</div>` : ''}
    </div>`;
  }

  const open   = ASSIGNMENTS.filter(a => a.status === 'open').sort((a, b) => a.due - b.due);
  const closed = ASSIGNMENTS.filter(a => a.status === 'closed').sort((a, b) => b.due - a.due);

  const totalFlagged = ASSIGNMENTS.reduce((sum, a) => sum + allStudents.filter(s => {
    const subs = getSubs(s.id, a.id);
    return checkFlag(subs).length > 0 || getIntegrityFlags(subs).length > 0;
  }).length, 0);

  let html = '';
  if (open.length)   html += `<div style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.8px;color:var(--text-muted);margin-bottom:8px">Open</div><div style="display:flex;flex-direction:column;gap:6px">${open.map(assignmentCard).join('')}</div>`;
  if (closed.length) html += `<div style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.8px;color:var(--text-muted);margin-top:20px;margin-bottom:8px">Closed</div><div style="display:flex;flex-direction:column;gap:6px">${closed.map(assignmentCard).join('')}</div>`;

  return `
    <div class="content-header">
      <div class="content-title">Assignments</div>
      <div class="content-meta">${ASSIGNMENTS.length} assignments · ${open.length} open${totalFlagged ? ` · <span style="color:var(--terra)">⚑ review</span>` : ''}</div>
    </div>
    ${html}
  `;
}

function renderClassContent() {
  if (activeClass === 'overview') return renderClassOverview();
  const cls = CLASSES.find(x => x.id === activeClass);
  if (!cls) return renderClassOverview();
  const students   = cls.studentIds.map(sid => STUDENTS.find(s => s.id === sid)).filter(Boolean);
  const n          = students.length;
  const openCount  = ASSIGNMENTS.filter(a => a.status === 'open').length;
  const totalFlags = students.filter(s => hasAnyFlag(s.id)).length;

  const byDueDesc = (a, b) => b.due - a.due;
  const open   = sortAssignments(ASSIGNMENTS.filter(a => a.status === 'open').sort(byDueDesc));
  const closed = sortAssignments(ASSIGNMENTS.filter(a => a.status === 'closed').sort(byDueDesc));

  function buildRow(a) {
    const allSubs   = students.map(s => getSubs(s.id, a.id));
    const submitted = allSubs.filter(s => s.length > 0).length;
    const isClosed  = a.status === 'closed';
    const dueStr    = a.due.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
    const missing   = isClosed && submitted < n ? n - submitted : 0;
    const flagCount = students.filter(s => {
      const subs = getSubs(s.id, a.id);
      return checkFlag(subs).length > 0 || getIntegrityFlags(subs).length > 0;
    }).length;
    const bar      = distributionBar(cls.studentIds, a.id);
    const expanded = expandedInClass === a.id;

    const mainRow = `<tr class="${expanded ? 'expanded-row' : ''}" onclick="toggleClassDrill('${a.id}')">
      <td>
        <div style="font-weight:600;font-size:13px">${a.name}</div>
        <div style="font-size:11px;color:var(--text-muted);margin-top:2px">Due ${dueStr} · ${isClosed ? 'Closed' : 'Open'}</div>
      </td>
      <td>
        <span style="font-weight:600;${isClosed && submitted < n ? 'color:var(--terra)' : ''}">${submitted}</span><span style="color:var(--text-muted)"> / ${n}</span>
        ${missing ? `<div style="font-size:11px;color:var(--terra);margin-top:2px">${missing} missing</div>` : ''}
      </td>
      <td>${bar}</td>
      <td>${flagCount ? `<span class="flag-badge">⚑ review</span>` : '<span style="color:var(--text-muted);font-size:12px">—</span>'}</td>
    </tr>`;

    const drillRow = expanded
      ? `<tr class="drill-row"><td colspan="4" style="padding:0">${renderClassDrillPanel(a, students)}</td></tr>`
      : '';

    return mainRow + drillRow;
  }

  function groupHeader(label) {
    return `<tr style="pointer-events:none">
      <td colspan="4" style="padding:10px 14px 4px;background:var(--bg);border-bottom:none">
        <span style="font-size:10px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.8px">${label}</span>
      </td>
    </tr>`;
  }

  const rows = [
    ...(open.length   ? [groupHeader('Open'),   ...open.map(buildRow)]   : []),
    ...(closed.length ? [groupHeader('Closed'), ...closed.map(buildRow)] : []),
  ].join('');

  const metaParts = [
    `${n} student${n !== 1 ? 's' : ''}`,
    `${ASSIGNMENTS.length} assignment${ASSIGNMENTS.length !== 1 ? 's' : ''}`,
    openCount ? `${openCount} open` : 'all closed',
  ];
  if (totalFlags) metaParts.push(`<span style="color:var(--terra)">⚑ review</span>`);

  return `
    <div class="content-header">
      <div class="content-title">${cls.name}</div>
      <div class="content-meta">${metaParts.join(' · ')}</div>
    </div>
    <table class="data-table">
      <colgroup>
        <col style="width:auto">
        <col style="width:100px">
        <col style="width:140px">
        <col style="width:80px">
      </colgroup>
      <thead><tr>
        ${sortTh('Assignment',   'name',      classSort)}
        ${sortTh('Submitted',    'submitted', classSort)}
        <th>Class spread</th>
        ${sortTh('Flags',        'flags',     classSort)}
      </tr></thead>
      <tbody>${rows}</tbody>
    </table>
    <div class="bar-legend">
      <span>Spread:</span>
      <span><span class="legend-swatch" style="background:#3B3EA8"></span>Redefinition</span>
      <span><span class="legend-swatch" style="background:#6B7DD4"></span>Modification</span>
      <span><span class="legend-swatch" style="background:#9B9DE0"></span>Augmentation</span>
      <span><span class="legend-swatch" style="background:#ccc"></span>Substitution</span>
      <span><span class="legend-swatch" style="background:#e5e5e2"></span>Not submitted</span>
    </div>
    <p style="margin-top:10px;font-size:12px;color:var(--text-muted)">Click an assignment to view student breakdown.</p>
  `;
}

function renderAssignmentContent() {
  if (activeAssignment === 'overview') return renderAssignmentOverview();
  const a = ASSIGNMENTS.find(x => x.id === activeAssignment);
  if (!a) return renderAssignmentOverview();
  const closed = a.status === 'closed';
  const dueStr = a.due.toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' });

  const rows = [];
  CLASSES.forEach(cls => {
    const classStudents = sortStudents(
      cls.studentIds.map(sid => STUDENTS.find(s => s.id === sid)).filter(Boolean),

      <td colspan="5" style="padding:10px 14px 4px;background:var(--bg);border-bottom:none">
        <span style="font-size:10px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.8px">${cls.name}</span>
      </td>
    </tr>`);

    classStudents.forEach(s => {
      const subs     = getSubs(s.id, a.id);
      const lat      = latestSub(subs);
      const t        = lat ? total(lat) : null;
      const st       = submissionStatus(subs, a);
      const sig      = getStudentSignal(s.id, a.id);
      const expanded = expandedInAssignment === s.id;

      rows.push(`<tr class="${expanded ? 'expanded-row' : ''}" onclick="toggleAssignmentDrill('${s.id}')">
        <td>
          <div style="display:flex;align-items:center;gap:8px">
            <div class="avatar" style="width:26px;height:26px;font-size:10px">${s.initials}</div>
            <div>
              <div style="font-weight:500;font-size:13px;display:flex;align-items:center;gap:6px">
                ${s.name}

        </td>

        <td>${t !== null ? `<span class="samr-badge ${samr(t).cls}">${samr(t).label}</span>` : '<span style="color:var(--text-muted)">—</span>'}</td>

    <div class="content-header">
      <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
        <div class="content-title">${a.name}</div>
        <span class="chip ${closed ? 'chip-grey' : 'chip-amber'}">${closed ? 'Closed' : 'Open'}</span>
      </div>
      <div class="content-meta">${metaParts.join(' · ')}</div>
    </div>
    <table class="data-table">
      <colgroup>
        <col style="width:auto">
        <col style="width:100px">
        <col style="width:100px">
        <col style="width:140px">
        <col style="width:120px">
      </colgroup>
      <thead><tr>
        ${sortTh('Student',     'name',        assignmentSort)}
        ${sortTh('Submissions', 'submissions',  assignmentSort)}
        ${sortTh('Latest TAU', 'tau',           assignmentSort)}
        ${sortTh('SAMR',        'samr',         assignmentSort)}
        ${sortTh('Status',      'status',       assignmentSort)}

      <tbody>${rows.join('')}</tbody>
